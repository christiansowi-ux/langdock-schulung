<style>@font-face{font-family:"Archivo";font-style:normal;font-weight:400 800;font-display:swap;src:url(/hefte/assets/fonts/archivo-latin.woff2) format("woff2")}

.live.breit{width:max(320px,50cqw)}

eName": "", "liveDaten": null}, {"id": "2", "bild": "/hefte/folien/tag-26/02.jpg", "daumen": "/hefte/folien/tag-26/t02.jpg", "label": "Folie 2/38", "titel": "Der rote Faden", "kern": "Die Landkarte: ein Fall, sechs Blöcke. Nur kurz zeigen, nicht vorlesen.", "frage": "", "hinweis": "", "fun": "", "notiz": "Diese Folie kommt in jedem Block an derselben Stelle und in derselben Gestaltung. Sie ist die Landkarte — kurz zeigen, nicht vorlesen. Nur der Satz zum aktuellen Block wird ausgesprochen.", "orte": [{"x": 35.61, "y": 79.46, "w": 8.53, "h": 2.41, "t": "Projektdossier", "e": "Die vollständige Mappe zu eurem Fall: vom Steckbrief bis zur Übergabe.", "b": ""}, {"x": 37.68, "y": 60.76, "w": 10.33, "h": 2.34, "t": "Die Frage von heute", "e": "Nicht wie es sein sollte. Wie es gestern war.", "b": ""}], "live": "", "liveName": "", "liveDaten": null}, {"id": "3", "bild": "/hefte/folien/tag-26/03.jpg", "daumen": "/hefte/folien/tag-26/t03.jpg", "label": "Folie 3/38", "titel": "Abschnitt 1: Ausgangslage", "kern": "Abschnitt 1: Warum Prozesse so aussehen, wie sie aussehen. Und warum das kein Vorwurf ist.", "frage": "", "hinweis": "", "fun": "", "notiz": "Einstieg: Warum Prozesse so aussehen, wie sie aussehen — und warum das kein Vorwurf ist. Kurz halten.", "orte": [], "live": "", "liveName": "", "liveDaten": null}, {"id": "4", "bild": "/hefte/folien/tag-26/04.jpg", "daumen": "/hefte/folien/tag-26/t04.jpg", "label": "Folie 4/38", "titel": "Typische Ausgangssituation", "kern": "Prozesse wurden selten entworfen. Sie sind einfach passiert. Das fällt erst auf, wenn eine Automatisierung eine klare Regel verlangt.", "frage": "Wer hat den eigenen Prozess dokumentiert? Und wer glaubt, dass die Dokumentation den echten Ablauf beschreibt?", "hinweis": "", "fun": "Wie die Besteckschublade: nie geplant, irgendwie gewachsen, und nur eine Person weiß, wo der Korkenzieher liegt.", "notiz": "Die Gruppe fragen, wer den eigenen Prozess dokumentiert hat. Meist wenige Hände. Dann fragen, wer glaubt, dass die Dokumentation den tatsächlichen Ablauf beschreibt. Meist noch weniger.", "orte": [{"x": 6.98, "y": 26.41, "w": 16.62, "h": 3.12, "t": "Historisch gewachsen", "e": "Um Personen, Systemwechsel und Ausnahmen herum entstanden, nie am Reißbrett.", "b": "„Das machen wir so, seit das 2014 jemand eingeführt hat.“"}, {"x": 37.26, "y": 26.41, "w": 19.75, "h": 3.12, "t": "Wissen in Köpfen", "e": "Was dokumentiert ist, ist selten der gelebte Ablauf.", "b": "„Im Handbuch steht das anders, aber so geht es schneller.“"}, {"x": 67.53, "y": 26.41, "w": 20.34, "h": 3.12, "t": "Unterschiedliche Abläufe", "e": "Derselbe Vorgang läuft je nach Person oder Tageszeit anders.", "b": ""}, {"x": 6.98, "y": 59.65, "w": 20.34, "h": 3.12, "t": "Unklare Zuständigkeit", "e": "Wer prüft? Wer entscheidet final?", "b": "„Das müsste eigentlich die Teamleitung … oder?“"}, {"x": 37.26, "y": 59.65, "w": 17.47, "h": 3.12, "t": "Inkonsistente Daten", "e": "Dieselbe Information steht mal so und mal so da. Eine Regel kann damit nichts anfangen.", "b": "„Das Feld ist Pflicht, außer wir schreiben eine 0 rein.“"}], "live": "", "liveName": "", "liveDaten": null}, {"id": "5", "bild": "/hefte/folien/tag-26/05.jpg", "daumen": "/hefte/folien/tag-26/t05.jpg", "label": "Folie 5/38", "titel": "Zwei Wege, ein Ergebnis", "kern": "Beide Personen arbeiten richtig. Aber nur den linken Weg kann man aufschreiben, und nur was beschreibbar ist, ist automatisierbar.", "frage": "Wann ist der rechte Weg sogar der bessere?", "hinweis": "", "fun": "Zwei Kartoffelsalate, beide köstlich. Der eine nach Rezept. Der andere von Oma: „Wie viel Salz?“ „Bis es passt.“ Nur das Rezept kannst du weitergeben.", "notiz": "Wichtig: Der rechte Pfad ist nicht schlechter. Er ist oft der bessere, wenn es um schwierige Fälle geht. Das Ziel ist nicht, ihn abzuschaffen, sondern zu wissen, wann er greift.", "orte": [{"x": 6.98, "y": 29.92, "w": 16.19, "h": 2.41, "t": "Regelbasiert", "e": "Jedes Mal dieselben Schritte. Lässt sich beschreiben und bauen.", "b": ""}, {"x": 52.45, "y": 29.92, "w": 21.04, "h": 2.41, "t": "Erfahrungsbasiert", "e": "Nicht schlechter! Bei schwierigen Fällen oft der bessere Weg. Du musst nur wissen, wann er greift.", "b": ""}, {"x": 53.91, "y": 67.04, "w": 5.42, "h": 2.31, "t": "Die Schleife", "e": "Klingt nach Umweg, ist aber Qualitätskontrolle im Kopf. Eine Maschine bräuchte dafür eine Regel.", "b": ""}], "live": "", "liveName": "", "liveDaten": null}, {"id": "6", "bild": "/hefte/folien/tag-26/06.jpg", "daumen": "/hefte/folien/tag-26/t06.jpg", "label": "Folie 6/38", "titel": "Kernsatz: Die Unschärfe", "kern": "Ein Teil des Nutzens entsteht, bevor irgendetwas automatisiert ist: Die Organisation entscheidet zum ersten Mal, wie der Ablauf laufen soll.", "frage": "", "hinweis": "Kommunikationsregel: Widersprüche sind kein Vorwurf. Wer das anders vermittelt, bekommt in der nächsten Sitzung keine ehrlichen Antworten mehr.", "fun": "Beim Umzug merkst du, dass ihr vier Kellen und keinen Dosenöffner habt. Das Aufräumen hat schon etwas gebracht, bevor der Wagen da ist.", "notiz": "Ein Automatisierungsprojekt zwingt eine Organisation, zum ersten Mal explizit zu entscheiden, wie ein Prozess laufen soll. Ein erheblicher Teil des Wertes entsteht dadurch — bevor irgendetwas automatisiert ist. Daraus folgt eine Kommunikationsregel: Widersprüche, die in der Aufnahme sichtbar werden, sind kein Vorwurf an die Beteiligten. Wer das anders vermittelt, bekommt in der nächsten Sitzung keine ehrlichen Antworten mehr.", "orte": [{"x": 15.37, "y": 46.61, "w": 17.19, "h": 6.67, "t": "Unschärfe", "e": "Dass niemand genau sagen kann, wie es läuft. Genau hier fängt der Wert an.", "b": ""}], "live": "", "liveName": "", "liveDaten": null}, {"id": "7", "bild": "/hefte/folien/tag-26/07.jpg", "daumen": "/hefte/folien/tag-26/t07.jpg", "label": "Folie 7/38", "titel": "Abschnitt 2: Ziel und Fragen", "kern": "Abschnitt 2: Vom Befund zum Auftrag. Was genau soll anders werden?", "frage": "", "hinweis": "", "fun": "", "notiz": "Vom Befund zum Auftrag: Wie ein Projekt startet, wie ein Ziel aussieht und welche Fragen früh gestellt gehören.", "orte": [], "live": "", "liveName": "", "liveDaten": null}, {"id": "8", "bild": "/hefte/folien/tag-26/08.jpg", "daumen": "/hefte/folien/tag-26/t08.jpg", "label": "Folie 8/38", "titel": "Wie ein Projekt wirklich startet", "kern": "Ein gutes Projekt beginnt mit etwas, das wehtut. Der Fachbereich beschreibt das Problem, nicht die Lösung.", "frage": "Wer traut sich: Euer Problem in drei Sätzen, ohne ein Werkzeug zu nennen?", "hinweis": "", "fun": "Beim Arzt sagst du: „Mir tut der Hals weh.“ Wer sagt „Verschreiben Sie mir Antibiotika“, verhindert jede bessere Lösung. Vielleicht war es nur der Schal.", "notiz": "Der praktische Test unten ist der Prüfsatz für jeden Projektstart. Laut vorlesen.", "orte": [{"x": 5.21, "y": 26.96, "w": 26.79, "h": 3.12, "t": "Der Schmerz", "e": "Etwas kostet nachweisbar Zeit, Geld oder Nerven.", "b": "Kundschaft wartet drei Tage auf Antworten."}, {"x": 46.47, "y": 16.2, "w": 8.5, "h": 2.78, "t": "Fachbereich", "e": "Die Abteilung, die den Ablauf täglich macht und das Problem am besten kennt.", "b": ""}, {"x": 5.21, "y": 64.55, "w": 22.0, "h": 3.12, "t": "Die Reihenfolge", "e": "Erst wenn der Nutzen messbar ist, lohnt sich die technische Umsetzung.", "b": ""}, {"x": 7.08, "y": 78.19, "w": 7.71, "h": 2.41, "t": "Der Test", "e": "Drei Sätze ohne Werkzeug. Laut vorlesen.", "b": "„Wir brauchen einen Chatbot“ fällt sofort durch."}], "live": "", "liveName": "", "liveDaten": null}, {"id": "9", "bild": "/hefte/folien/tag-26/09.jpg", "daumen": "/hefte/folien/tag-26/t09.jpg", "label": "Folie 9/38", "titel": "Kein Ziel und ein Ziel", "kern": "Derselbe Wunsch, zweimal. Nur einen davon kann man in sechs Monaten überprüfen.", "frage": "", "hinweis": "Aufgefallen? Nach Folie 10 fehlt auch dem guten Ziel noch der Zeitpunkt. Folie 9 zeigt den ersten Schritt, nicht das fertige Ziel.", "fun": "„Ich will mehr Sport machen“ überlebt selten den Januar.", "notiz": "Der Unterschied ist nicht Formulierungskunst. Er entscheidet, ob man je feststellen kann, ob das Projekt funktioniert hat.", "orte": [{"x": 7.4, "y": 66.64, "w": 11.05, "h": 2.72, "t": "Die offenen Fragen", "e": "Solange diese drei offen sind, kann niemand je sagen, ob das Projekt funktioniert hat.", "b": ""}, {"x": 52.86, "y": 73.21, "w": 6.71, "h": 2.72, "t": "Fallmenge", "e": "Genau die Fälle, für die das Ziel gilt.", "b": ""}, {"x": 81.9, "y": 79.96, "w": 10.71, "h": 2.59, "t": "Sortierquote", "e": "Der Anteil richtig vorsortierter Anfragen. Eine Zahl, die man ablesen kann.", "b": ""}], "live": "spiel", "liveName": "Spiel", "liveDaten": {"titel": "Wunsch oder Ziel?", "optionen": ["Wunsch", "Ziel"], "raenge": [[1.0, "Chefermittlung", "Alles aufgeklärt. Die Akte kann geschlossen werden."], [0.6, "Kommissariat", "Solide Spurensuche. Eine Runde mehr und du leitest das Dezernat."], [0, "Streifendienst", "Jede Ermittlung fängt so an. Schau dir die Erklärungen an und versuch es gleich nochmal."]], "karten": [{"t": "Wir wollen weniger E-Mails manuell bearbeiten.", "r": "Wunsch", "w": "Original von Folie 9. Wie viel weniger? Welche? Woran gemessen? Alles offen.", "o": null}, {"t": "Unser Ablauf soll moderner werden.", "r": "Wunsch", "w": "„Modern“ ist keine Maßeinheit. Dein Kühlschrank ist auch modern und hat trotzdem nichts automatisiert.", "o": null}, {"t": "70 Prozent der Rechnungen unter 1.000 Euro ohne Klärungsbedarf werden ohne manuelle Prüfung freigegeben, gemessen an der Freigabequote im Monatsbericht, ab drei Monaten nach Start.", "r": "Ziel", "w": "Das Musterbeispiel von Folie 10: alle fünf Bausteine sind da.", "o": null}, {"t": "Wir machen jetzt was mit KI.", "r": "Wunsch", "w": "Das ist kein Ziel, das ist eine Lösung auf der Suche nach einem Problem.", "o": null}, {"t": "Jeder eingehende Lead enthält beim Übergang an den Vertrieb mindestens fünf definierte Zusatzfelder, gemessen am Anteil vollständiger Datensätze im CRM, ab dem zweiten Monat.", "r": "Ziel", "w": "Auch von Folie 10. Klingt sperrig, lässt sich aber in sechs Monaten eindeutig prüfen.", "o": null}, {"t": "90 Prozent der Druckanfragen im Standardformat werden automatisch vorsortiert.", "r": "Wunsch", "w": "Knapp! Anteil, Fallmenge und Handlung stehen da. Es fehlen Kennzahl und Zeitpunkt.", "o": null}, {"t": "Die Durchlaufzeit von Standardrechnungen sinkt bis Ende März von 5 auf 1,5 Tage, gemessen an den Zeitstempeln im System.", "r": "Ziel", "w": "Menge, Fallmenge, Handlung, Kennzahl, Zeitpunkt. Alles dabei, und sogar mit Ausgangswert.", "o": null}, {"t": "Alle sollen mit dem neuen Werkzeug glücklicher sein.", "r": "Wunsch", "w": "Schön wär’s. Woran misst du Glück? An der Lautstärke in der Kaffeeküche?", "o": null}]}}, {"id": "10", "bild": "/hefte/folien/tag-26/10.jpg", "daumen": "/hefte/folien/tag-26/t10.jpg", "label": "Folie 10/38", "titel": "Ein Ziel hat fünf Bausteine", "kern": "Fünf Bausteine. Fehlt einer, kann in sechs Monaten niemand mehr prüfen, ob es funktioniert hat.", "frage": "Wer liest den zusammengesetzten Satz laut vor?", "hinweis": "", "fun": "Ohne Zeitpunkt kann das Projekt auch 2049 noch erfolgreich werden.", "notiz": "Fehlt ein Baustein, entsteht ein Satz, den man in sechs Monaten nicht mehr prüfen kann. Den zusammengesetzten Satz laut vorlesen.", "orte": [{"x": 6.56, "y": 29.15, "w": 12.26, "h": 2.69, "t": "Anteil oder Menge", "e": "Wie viel? Eine Zahl, kein „mehr“.", "b": ""}, {"x": 24.62, "y": 29.15, "w": 8.77, "h": 2.69, "t": "Abgegrenzte Fallmenge", "e": "Von welchen Fällen genau? Das ist die Grenze des Projekts.", "b": ""}, {"x": 42.69, "y": 29.15, "w": 13.07, "h": 2.69, "t": "Konkrete Handlung", "e": "Was passiert mit diesen Fällen?", "b": ""}, {"x": 60.75, "y": 29.15, "w": 6.32, "h": 2.69, "t": "Kennzahl", "e": "An welcher Zahl liest du den Erfolg ab?", "b": ""}, {"x": 78.81, "y": 29.15, "w": 6.47, "h": 2.69, "t": "Zeitpunkt", "e": "Ab wann gilt das? Wird am häufigsten vergessen.", "b": ""}, {"x": 73.25, "y": 65.33, "w": 3.06, "h": 2.63, "t": "Lead", "e": "Eine interessierte Person oder Firma, die der Vertrieb noch ansprechen möchte.", "b": ""}, {"x": 71.01, "y": 75.98, "w": 3.22, "h": 2.63, "t": "CRM", "e": "Customer Relationship Management. Die Software für Kundendaten und Vertrieb.", "b": ""}], "live": "ziel", "liveName": "Mitmachen", "liveDaten": {"bausteine": [["Anteil oder Menge", "70 Prozent", "Wie viel denn? „Mehr“ ist keine Zahl."], ["Fallmenge", "der Rechnungen unter 1.000 Euro ohne Klärungsbedarf", "Alle? Wirklich alle? Auch die von 1987?"], ["Handlung", "werden ohne manuelle Prüfung freigegeben", "Was soll eigentlich passieren?"], ["Kennzahl", "gemessen an der Freigabequote im Monatsbericht", "Woran merkst du es? „Gefühlt besser“ zählt nicht."], ["Zeitpunkt", "ab drei Monaten nach Start", "So kann das Projekt auch 2049 noch erfolgreich werden."]]}}, {"id": "11", "bild": "/hefte/folien/tag-26/11.jpg", "daumen": "/hefte/folien/tag-26/t11.jpg", "label": "Folie 11/38", "titel": "Die richtigen Fragen zum Projektstart", "kern": "Die linke Spalte kennt jede Person. Die rechte entscheidet über den Zeitplan.", "frage": "Welche der fünf rechten Fragen könnt ihr für euren Fall heute nicht beantworten?", "hinweis": "", "fun": "Familienurlaub: Alle reden mit, wohin es geht. Wichtiger: Wer bucht am Ende, und ist der Reisepass noch gültig?", "notiz": "Die rechte Spalte ist der Inhalt dieser Folie. Besonders die Systemzugänge: Das ist regelmäßig der längste Einzelposten im Zeitplan.", "orte": [{"x": 44.72, "y": 31.28, "w": 18.28, "h": 2.69, "t": "Wer entscheidet?", "e": "Nicht wer mitredet, sondern wer freigibt.", "b": ""}, {"x": 54.41, "y": 44.37, "w": 9.32, "h": 2.41, "t": "Eskalationsweg", "e": "Wohin wandert ein Fall, wenn jemand nicht weiterkommt? Das ist die Vorlage für den automatisierten Weg.", "b": ""}, {"x": 68.77, "y": 49.98, "w": 17.84, "h": 2.69, "t": "Die Zugänge", "e": "Regelmäßig der längste Einzelposten: gebaut in Tagen, Zugang nach Wochen.", "b": ""}, {"x": 53.93, "y": 59.43, "w": 7.62, "h": 2.69, "t": "Betriebsrat", "e": "Bei Technik, die Verhalten oder Leistung überwachen kann, hat er ein Mitbestimmungsrecht. Früh informieren spart Monate.", "b": ""}, {"x": 71.6, "y": 69.0, "w": 10.4, "h": 2.41, "t": "Saisonale Spitzen", "e": "Zeiten mit viel mehr Vorgängen. Ein Test im ruhigen Monat sagt wenig über das Jahresende.", "b": ""}], "live": "", "liveName": "", "liveDaten": null}, {"id": "12", "bild": "/hefte/folien/tag-26/12.jpg", "daumen": "/hefte/folien/tag-26/t12.jpg", "label": "Folie 12/38", "titel": "Fallbeispiel Rechnungsfreigabe", "kern": "So klingen Antworten, die tragen: eine Zahl, eine Grenze und eine ausdrückliche Ausschlussliste.", "frage": "", "hinweis": "Folie 12 sagt vier Minuten je Vorgang, Folie 22 zwölf Minuten gesamt. Das passt nur, wenn die vier allein die Buchhaltung meinen. Sag immer dazu, was du misst.", "fun": "", "notiz": "Der Unterschied zwischen einer Absichtserklärung und einer Arbeitsgrundlage: eine Zahl, eine Grenze und eine ausdrückliche Ausschlussliste.", "orte": [{"x": 53.5, "y": 25.34, "w": 5.85, "h": 2.72, "t": "Repetitiv", "e": "Immer wieder dasselbe. Der klassische Kandidat.", "b": ""}, {"x": 30.42, "y": 36.73, "w": 16.09, "h": 2.72, "t": "Das Volumen", "e": "Dieselbe Zahl wie gestern im Business Case.", "b": ""}, {"x": 37.02, "y": 48.12, "w": 9.77, "h": 2.72, "t": "Klärungsbedarf", "e": "Bei der Rechnung ist etwas unklar und ein Mensch muss nachfragen.", "b": ""}, {"x": 71.15, "y": 55.9, "w": 8.32, "h": 2.72, "t": "Bestellbezug", "e": "Zur Rechnung gibt es eine Bestellung, die sich zuordnen lässt.", "b": ""}, {"x": 69.51, "y": 67.38, "w": 18.47, "h": 2.72, "t": "Gleiche Fehlerquote", "e": "Schneller, aber nicht schlechter. Auch das ist ein Erfolgskriterium.", "b": ""}], "live": "spiel", "liveName": "Spiel", "liveDaten": {"titel": "An der Scope-Tür", "optionen": ["Rein", "Raus"], "raenge": [[1.0, "Chefermittlung", "Alles aufgeklärt. Die Akte kann geschlossen werden."], [0.6, "Kommissariat", "Solide Spurensuche. Eine Runde mehr und du leitest das Dezernat."], [0, "Streifendienst", "Jede Ermittlung fängt so an. Schau dir die Erklärungen an und versuch es gleich nochmal."]], "karten": [{"t": "Büromaterial, 240 Euro, mit Bestellnummer", "r": "Rein", "w": "Standardfall. Bitte durchgehen.", "o": null}, {"t": "Druckerwartung, 1.480 Euro, mit Bestellnummer", "r": "Raus", "w": "Über 1.000 Euro. Tut uns leid, die Liste ist die Liste.", "o": null}, {"t": "Projektabrechnung Messestand, 900 Euro", "r": "Raus", "w": "Der Betrag würde passen, aber Projektabrechnungen stehen ausdrücklich draußen.", "o": null}, {"t": "Kaffeebohnen, 86 Euro, ohne Bestellbezug", "r": "Raus", "w": "Auch Kaffee braucht einen Bestellbezug. Das tut weh, ist aber so.", "o": null}, {"t": "Software-Lizenz, 300 Euro, Klärungsvermerk „Betrag prüfen“", "r": "Raus", "w": "Klärungsvermerk heißt: bleibt beim Menschen.", "o": null}, {"t": "Reinigungsdienst, 650 Euro, mit Bestellnummer", "r": "Rein", "w": "Alles sauber. Im wahrsten Sinne.", "o": null}, {"t": "Beratung, exakt 1.000,00 Euro, mit Bestellnummer", "r": "Raus", "w": "Erwischt! Sie steht in keiner Liste: weder „unter 1.000“ noch „über 1.000“. Hier greift der Schutzsatz von Folie 30: Was nicht ausdrücklich dazugehört, bleibt draußen. Du hast gerade eine Lücke im Scope gefunden.", "o": null}, {"t": "Neuer Lieferant, 400 Euro, mit Bestellnummer", "r": "Rein", "w": "Laut Liste rein. Und eine prima Frage fürs nächste Gespräch: Soll das bei neuen Lieferanten wirklich so sein?", "o": null}]}}, {"id": "13", "bild": "/hefte/folien/tag-26/13.jpg", "daumen": "/hefte/folien/tag-26/t13.jpg", "label": "Folie 13/38", "titel": "Abschnitt 3: Prozessaufnahme", "kern": "Abschnitt 3: Jetzt wird aufgenommen. Ab hier arbeitet ihr am eigenen Fall.", "frage": "", "hinweis": "", "fun": "", "notiz": "Jetzt wird aufgenommen: Interview, Nachfragen, Mitschrift. Ab hier arbeitet die Gruppe am eigenen Fall.", "orte": [], "live": "", "liveName": "", "liveDaten": null}, {"id": "14", "bild": "/hefte/folien/tag-26/14.jpg", "daumen": "/hefte/folien/tag-26/t14.jpg", "label": "Folie 14/38", "titel": "Prozessaufnahme in der Praxis", "kern": "Prozesse werden erzählt. Die Kunst liegt im Nachfragen.", "frage": "", "hinweis": "", "fun": "Fragebogen beim Arzt: „Wie viel Alkohol?“ „Selten.“ Im Gespräch stellt sich heraus: jedes Wochenende.", "notiz": "Das Musterbeispiel unten ist der Kern: „Dann geben wir die Rechnung frei“ ist keine Prozessbeschreibung.", "orte": [{"x": 6.88, "y": 30.94, "w": 11.34, "h": 3.12, "t": "Interview", "e": "Ein Fragebogen bekommt die geschönte Version. Im Gespräch kommt die echte.", "b": ""}, {"x": 29.58, "y": 43.2, "w": 9.75, "h": 2.63, "t": "Übergaben", "e": "Wenn eine Aufgabe die Person wechselt. Hier entsteht meist die Wartezeit.", "b": ""}, {"x": 52.29, "y": 30.94, "w": 11.83, "h": 3.12, "t": "Ausnahmen zuerst", "e": "Den Standardfall erzählen alle gleich. Interessant wird es bei den Ausnahmen.", "b": ""}, {"x": 7.84, "y": 76.79, "w": 12.18, "h": 4.09, "t": "Das Musterbeispiel", "e": "Wer ist „wir“? Nach welchen Kriterien? Und was, wenn jemand unsicher ist?", "b": "Kim: „Dann geben wir sie frei.“ Du: „Wer ist wir?“ Kim: „Normalerweise ich.“ Du: „Und wenn nicht?“"}], "live": "spiel", "liveName": "Spiel", "liveDaten": {"titel": "Welche Rückfrage passt?", "optionen": null, "raenge": [[1.0, "Chefermittlung", "Alles aufgeklärt. Die Akte kann geschlossen werden."], [0.6, "Kommissariat", "Solide Spurensuche. Eine Runde mehr und du leitest das Dezernat."], [0, "Streifendienst", "Jede Ermittlung fängt so an. Schau dir die Erklärungen an und versuch es gleich nochmal."]], "karten": [{"t": "„Normalerweise leite ich die Rechnung gleich weiter.“", "r": "Und wenn nicht? Wie oft ist „nicht normalerweise“?", "w": "Hinter „normalerweise“ steckt eine unbekannte Menge an Ausnahmen.", "o": ["Super, dann weiß ich Bescheid.", "Und wenn nicht? Wie oft ist „nicht normalerweise“?", "Warum machst du das nicht immer?"]}, {"t": "„Ob das eine Sonderrechnung ist, das sieht man dann schon.“", "r": "Woran genau? Nenne mir drei Merkmale.", "w": "Erfahrungswissen wird erst nutzbar, wenn es Merkmale bekommt.", "o": ["Woran genau? Nenne mir drei Merkmale.", "Stimmt, sieht man.", "Warum steht das nirgends?"]}, {"t": "„Die Freigabe macht die Kollegin.“", "r": "Nach welchen Kriterien? Was passiert, wenn sie im Urlaub ist?", "w": "Ein Schritt ohne Regel und ohne Vertretung. Der Urlaub ist die beste Testfrage.", "o": ["Dann lassen wir den Schritt weg.", "Warum macht sie das und nicht du?", "Nach welchen Kriterien? Was passiert, wenn sie im Urlaub ist?"]}, {"t": "„Das ist eigentlich immer gleich.“", "r": "Zeig mir die letzten fünf Fälle.", "w": "Die Unterschiede fallen der erzählenden Person selbst nicht mehr auf. Fünf echte Fälle zeigen sie.", "o": ["Perfekt, dann automatisieren wir alles.", "Zeig mir die letzten fünf Fälle.", "Bist du dir sicher?"]}, {"t": "„Dann geben wir die Rechnung frei.“", "r": "Wer prüft? Nach welchen Kriterien? Was passiert bei Unsicherheit?", "w": "Das Musterbeispiel von Folie 14. Erst diese drei Antworten machen daraus einen Schritt, den man bauen kann.", "o": ["Wer prüft? Nach welchen Kriterien? Was passiert bei Unsicherheit?", "Und dann?", "Könnte das nicht eine KI machen?"]}, {"t": "„Wie das läuft? Das steht alles im Handbuch.“", "r": "Nimm den letzten Fall von gestern und erzähl mir Schritt für Schritt, was du gemacht hast.", "w": "Das Handbuch ist die Version, die sein sollte. Du willst die von gestern.", "o": ["Gut, dann lese ich das Handbuch.", "Wann wurde das Handbuch zuletzt aktualisiert?", "Nimm den letzten Fall von gestern und erzähl mir Schritt für Schritt, was du gemacht hast."]}, {"t": "„Schiefgehen? Das kommt eigentlich nie vor.“", "r": "Wann hat das zuletzt nicht funktioniert?", "w": "Schritt 4 auf Folie 15. Die Frage setzt voraus, dass es passiert ist, und bringt fast immer eine Geschichte.", "o": ["Wann hat das zuletzt nicht funktioniert?", "Schön, dann planen wir das nicht ein.", "Wirklich nie?"]}]}}, {"id": "15", "bild": "/hefte/folien/tag-26/15.jpg", "daumen": "/hefte/folien/tag-26/t15.jpg", "label": "Folie 15/38", "titel": "Der Ablauf eines Prozessinterviews", "kern": "Sechs Schritte, und der wertvollste ist die Gegenprobe.", "frage": "", "hinweis": "Im Auftrag auf Folie 17 kommt die Gegenprobe nicht vor, weil die Paare meist nicht aus demselben Team stammen. Nehmt sie als Hausaufgabe mit.", "fun": "Zwei Leute sehen einen Unfall. Eine sagt rot, die andere grün. Niemand lügt. Aber jetzt weißt du, wo du genauer hinschauen musst.", "notiz": "Sechs Schritte — und der wertvollste ist die Gegenprobe. Station 5 betonen: Die Abweichungen zwischen beiden Beschreibungen sind das wertvollste Ergebnis des ganzen Tages.", "orte": [{"x": 10.31, "y": 31.78, "w": 19.92, "h": 2.41, "t": "Der Einstieg", "e": "Ein echter Fall hat echte Umwege. „Wie läuft das bei euch?“ bekommt nur die Theorie.", "b": ""}, {"x": 9.79, "y": 43.91, "w": 20.25, "h": 2.41, "t": "Die drei Spalten", "e": "Was wird getan, wo passiert es, und was wird dort entschieden?", "b": ""}, {"x": 9.79, "y": 48.98, "w": 25.26, "h": 2.92, "t": "Nachbohren", "e": "Woran erkennst du das? Was, wenn das Feld leer ist? Wen fragst du dann?", "b": ""}, {"x": 10.25, "y": 61.78, "w": 22.99, "h": 2.41, "t": "Die beste Frage", "e": "Setzt voraus, dass es passiert ist. Bringt fast immer eine Geschichte.", "b": ""}, {"x": 34.75, "y": 15.46, "w": 8.63, "h": 2.78, "t": "Gegenprobe", "e": "Eine zweite Person aus demselben Team, unabhängig befragt.", "b": "Kim: „Ich leite sofort weiter.“ Alex: „Das kommt freitags als Sammelmail.“"}, {"x": 9.79, "y": 75.64, "w": 11.05, "h": 2.92, "t": "Zurückspiegeln", "e": "Vorlesen und bestätigen lassen. Was holprig klingt, ist meist eine fehlende Regel.", "b": ""}], "live": "spiel", "liveName": "Spiel", "liveDaten": {"titel": "In welche Spalte?", "optionen": ["Handlung", "System", "Entscheidung"], "raenge": [[1.0, "Chefermittlung", "Alles aufgeklärt. Die Akte kann geschlossen werden."], [0.6, "Kommissariat", "Solide Spurensuche. Eine Runde mehr und du leitest das Dezernat."], [0, "Streifendienst", "Jede Ermittlung fängt so an. Schau dir die Erklärungen an und versuch es gleich nochmal."]], "karten": [{"t": "Ich öffne die PDF-Rechnung aus dem Postfach.", "r": "Handlung", "w": "Jemand tut etwas.", "o": null}, {"t": "Der Ordner „Eingang Rechnungen“ im Mailprogramm", "r": "System", "w": "Hier liegt oder passiert etwas.", "o": null}, {"t": "Liegt der Betrag über 1.000 Euro?", "r": "Entscheidung", "w": "Eine Frage mit mehreren Ausgängen. Hier wird nachgebohrt.", "o": null}, {"t": "Ich trage die Bestellnummer ein.", "r": "Handlung", "w": "Wieder jemand, der etwas tut. Nachfrage: wo denn?", "o": null}, {"t": "Die Buchhaltungssoftware", "r": "System", "w": "Merke dir auch, wer die Zugänge verwaltet. Das wird der längste Posten im Zeitplan.", "o": null}, {"t": "Passt der Lieferant zur Bestellung?", "r": "Entscheidung", "w": "Und sofort nachbohren: Woran erkennst du das?", "o": null}, {"t": "Die Excel-Liste auf dem Desktop einer Kollegin", "r": "System", "w": "Auch das ist ein System. Leider. Es kommt trotzdem in den Ist-Prozess.", "o": null}, {"t": "Ich leite die Rechnung an die Fachabteilung weiter.", "r": "Handlung", "w": "Und eine Übergabe! Merk sie dir für die Bahnen.", "o": null}]}}, {"id": "16", "bild": "/hefte/folien/tag-26/16.jpg", "daumen": "/hefte/folien/tag-26/t16.jpg", "label": "Folie 16/38", "titel": "Vier Aussagen, bei denen immer nachgefragt wird", "kern": "Vier Sätze, die zuverlässig zeigen: Hier fehlt eine Regel. Die Rückfragen gibt es zum Mitnehmen.", "frage": "", "hinweis": "", "fun": "Bingo-Regel für den Rest des Tages: Wer einen dieser Sätze sagt, gibt einen aus. Gilt auch für die Schulungsleitung.", "notiz": "Diese vier Formulierungen markieren zuverlässig eine Stelle, an der die Regel fehlt. Die Rückfragen wörtlich mitgeben — sie werden im Arbeitsauftrag gebraucht.", "orte": [{"x": 7.42, "y": 32.35, "w": 9.41, "h": 4.09, "t": "Normalerweise", "e": "Hinter dem Wort steckt eine unbekannte Menge an Ausnahmen.", "b": ""}, {"x": 7.42, "y": 43.64, "w": 16.54, "h": 4.09, "t": "Das sieht man", "e": "Erfahrungswissen. Erst mit drei Merkmalen lässt es sich beschreiben.", "b": "„Wann ist das Steak gut?“ „Das sieht man dann schon.“"}, {"x": 7.42, "y": 54.85, "w": 14.25, "h": 4.09, "t": "Die Kollegin", "e": "Ein Schritt ohne Regel und ohne Vertretung. Der Urlaub ist die beste Testfrage.", "b": ""}, {"x": 7.42, "y": 66.14, "w": 19.11, "h": 4.09, "t": "Immer gleich", "e": "Die Unterschiede fallen der erzählenden Person selbst nicht mehr auf.", "b": ""}, {"x": 32.71, "y": 42.64, "w": 5.85, "h": 2.63, "t": "Implizites Wissen", "e": "Erfahrung, die jemand anwendet, aber nie aufgeschrieben hat.", "b": "Frag mal jemanden, wie man Fahrrad fährt."}, {"x": 32.71, "y": 65.24, "w": 4.59, "h": 2.63, "t": "Varianz", "e": "Unterschiede zwischen Fällen, die eigentlich gleich aussehen.", "b": ""}], "live": "bingo", "liveName": "Bingo", "liveDaten": [{"a": "Normalerweise …", "b": "Und wenn nicht? Wie oft ist „nicht normalerweise“?", "f": true}, {"a": "Da muss man den Dreh raushaben.", "b": "Was genau ist der Dreh? Zeig ihn mir an einem echten Fall.", "f": false}, {"a": "Das macht die Kollegin.", "b": "Nach welchen Kriterien? Was passiert, wenn sie im Urlaub ist?", "f": true}, {"a": "Das weiß eigentlich jeder.", "b": "Woher weiß das eine neue Person am ersten Tag?", "f": false}, {"a": "Das haben wir schon immer so gemacht.", "b": "Was würde passieren, wenn ihr es morgen nicht macht?", "f": false}, {"a": "Das klärt sich dann meistens.", "b": "Wer klärt es, und wie lange dauert das?", "f": false}, {"a": "Das sieht man dann schon.", "b": "Woran genau? Nenne mir drei Merkmale.", "f": true}, {"a": "Das steht irgendwo.", "b": "Wo genau? Zeig es mir bitte kurz.", "f": false}, {"a": "Das ist eigentlich immer gleich.", "b": "Zeig mir die letzten fünf Fälle.", "f": true}]}, {"id": "17", "bild": "/hefte/folien/tag-26/17.jpg", "daumen": "/hefte/folien/tag-26/t17.jpg", "label": "Folie 17/38", "titel": "Arbeitsauftrag 01: Interview", "kern": "Jetzt ihr: zu zweit, zwei Runden, Rollentausch ist Pflicht. Und die Bingo-Karte läuft mit.", "frage": "Nach Runde 1: Wer hat bei sich selbst einen Alarmsatz gehört?", "hinweis": "", "fun": "", "notiz": "Nach der ersten Runde kurz sammeln: Wer hat bei sich selbst eine der vier Alarmformulierungen gehört? Fast alle.", "orte": [{"x": 17.25, "y": 41.35, "w": 10.97, "h": 2.63, "t": "Wie er gestern war", "e": "Nicht das Handbuch, nicht das Ideal. Der letzte echte Fall.", "b": ""}, {"x": 56.04, "y": 64.68, "w": 4.21, "h": 2.63, "t": "Holprig", "e": "Die Stelle, an der es beim Vorlesen hakt, ist meist die, an der eine Regel fehlt.", "b": ""}], "live": "bingo", "liveName": "Bingo", "liveDaten": [{"a": "Normalerweise …", "b": "Und wenn nicht? Wie oft ist „nicht normalerweise“?", "f": true}, {"a": "Da muss man den Dreh raushaben.", "b": "Was genau ist der Dreh? Zeig ihn mir an einem echten Fall.", "f": false}, {"a": "Das macht die Kollegin.", "b": "Nach welchen Kriterien? Was passiert, wenn sie im Urlaub ist?", "f": true}, {"a": "Das weiß eigentlich jeder.", "b": "Woher weiß das eine neue Person am ersten Tag?", "f": false}, {"a": "Das haben wir schon immer so gemacht.", "b": "Was würde passieren, wenn ihr es morgen nicht macht?", "f": false}, {"a": "Das klärt sich dann meistens.", "b": "Wer klärt es, und wie lange dauert das?", "f": false}, {"a": "Das sieht man dann schon.", "b": "Woran genau? Nenne mir drei Merkmale.", "f": true}, {"a": "Das steht irgendwo.", "b": "Wo genau? Zeig es mir bitte kurz.", "f": false}, {"a": "Das ist eigentlich immer gleich.", "b": "Zeig mir die letzten fünf Fälle.", "f": true}]}, {"id": "18", "bild": "/hefte/folien/tag-26/18.jpg", "daumen": "/hefte/folien/tag-26/t18.jpg", "label": "Folie 18/38", "titel": "Abschnitt 4: Notation und Bahnen", "kern": "Abschnitt 4: Von der Mitschrift zur Darstellung. Ab hier wird gezeichnet.", "frage": "", "hinweis": "", "fun": "", "notiz": "Von der Mitschrift zur Darstellung: SIPOC, fünf Symbole, Bahnen. Ab hier wird gezeichnet.", "orte": [], "live": "", "liveName": "", "liveDaten": null}, {"id": "19", "bild": "/hefte/folien/tag-26/19.jpg", "daumen": "/hefte/folien/tag-26/t19.jpg", "label": "Folie 19/38", "titel": "SIPOC: Anfang und Ende festlegen", "kern": "SIPOC ist das Absperrband: Es legt fest, wo der Fall anfängt und wo er aufhört.", "frage": "Wer schafft alle fünf Spalten in zehn Minuten?", "hinweis": "", "fun": "", "notiz": "Die beiden Markierungen sind der eigentliche Zweck. Die häufigste Ursache für ausufernde Projekte ist ein Prozess, dessen Ende nie festgelegt wurde.", "orte": [{"x": 6.25, "y": 41.3, "w": 4.74, "h": 2.31, "t": "Lieferant", "e": "Woher kommt der Input? Auch ein Vorsystem kann das sein.", "b": "Pizza: die hungrige Person am Telefon."}, {"x": 24.83, "y": 36.78, "w": 3.72, "h": 2.87, "t": "Input", "e": "Was genau kommt an?", "b": "Pizza: die Bestellung."}, {"x": 43.42, "y": 40.93, "w": 4.68, "h": 2.31, "t": "Prozess", "e": "Fünf bis sieben Hauptschritte. Details kommen später.", "b": "Annehmen, belegen, backen, einpacken, ausfahren."}, {"x": 62.0, "y": 41.3, "w": 3.95, "h": 2.31, "t": "Output", "e": "Was entsteht am Ende?", "b": "Pizza: heiß an der Tür."}, {"x": 80.58, "y": 41.3, "w": 5.67, "h": 2.31, "t": "Empfänger", "e": "Wer bekommt das Ergebnis?", "b": ""}, {"x": 79.37, "y": 84.69, "w": 14.86, "h": 2.59, "t": "Das Ende", "e": "Häufigste Ursache für ausufernde Projekte: Das Ende wurde nie festgelegt.", "b": "Ob du am Tisch oder auf dem Sofa isst, gehört nicht mehr zur Pizzeria."}], "live": "", "liveName": "", "liveDaten": null}, {"id": "20", "bild": "/hefte/folien/tag-26/20.jpg", "daumen": "/hefte/folien/tag-26/t20.jpg", "label": "Folie 20/38", "titel": "BPMN in der schlanken Variante", "kern": "BPMN ist der weltweite Standard mit über hundert Symbolen. Wir nehmen fünf davon, und das ist gültiges BPMN.", "frage": "", "hinweis": "", "fun": "", "notiz": "Wichtigster Punkt ist der letzte: Zwei Prozessdarstellungen desselben Ablaufs sind schlimmer als keine. Vor dem Zeichnen nachfragen, ob es schon eine Prozesslandkarte gibt.", "orte": [{"x": 7.08, "y": 34.42, "w": 24.21, "h": 2.72, "t": "BPMN", "e": "Eine gemeinsame Zeichensprache für Abläufe, wie Noten für Musik.", "b": ""}, {"x": 15.84, "y": 41.92, "w": 11.58, "h": 2.72, "t": "QM", "e": "Qualitätsmanagement: geregelte Abläufe, oft mit Handbuch und Zertifizierung.", "b": ""}, {"x": 7.08, "y": 45.71, "w": 11.88, "h": 2.72, "t": "Prozesslandkarte", "e": "Die Übersicht über alle Abläufe eines Unternehmens.", "b": ""}, {"x": 22.05, "y": 73.77, "w": 11.57, "h": 2.72, "t": "Reservevokabular", "e": "Der Rest der Symbole. Wie Fremdwörter, die man fast nie braucht.", "b": ""}, {"x": 52.55, "y": 61.96, "w": 23.74, "h": 2.42, "t": "Erst nachfragen", "e": "Zwei Darstellungen desselben Ablaufs sind schlimmer als keine.", "b": ""}], "live": "", "liveName": "", "liveDaten": null}, {"id": "21", "bild": "/hefte/folien/tag-26/21.jpg", "daumen": "/hefte/folien/tag-26/t21.jpg", "label": "Folie 21/38", "titel": "Die fünf Symbole", "kern": "Nur benennen, nicht lange erklären. Wichtig ist der Satz ganz unten.", "frage": "", "hinweis": "", "fun": "Der U-Bahn-Plan verschweigt fast alles über die Stadt und wird genau deshalb von allen verstanden.", "notiz": "Die Symbole nur benennen, nicht erklären. Wichtig ist der Zusatz unten: Das Personensymbol markiert die Schritte, an denen später Kapazität, Zeit und rechtliche Verantwortung hängen.", "orte": [{"x": 80.62, "y": 30.85, "w": 6.75, "h": 2.41, "t": "Start", "e": "Der Auslöser. Jeder Workflow hat genau einen.", "b": ""}, {"x": 80.62, "y": 39.83, "w": 6.32, "h": 2.41, "t": "Ende", "e": "Kein Pfad endet im Nichts.", "b": ""}, {"x": 80.62, "y": 48.91, "w": 2.81, "h": 2.41, "t": "Aufgabe", "e": "Eine Handlung, automatisiert oder manuell.", "b": ""}, {"x": 80.62, "y": 58.63, "w": 5.28, "h": 2.41, "t": "Entscheidung", "e": "Die Raute. Ausgänge beschriften, höchstens zwei bis drei.", "b": ""}, {"x": 80.62, "y": 68.26, "w": 2.94, "h": 2.41, "t": "Bahn", "e": "Wer führt den Schritt aus? Wie Schwimmbahnen: Alle bleiben auf ihrer.", "b": ""}, {"x": 21.73, "y": 79.71, "w": 11.23, "h": 2.82, "t": "Personensymbol", "e": "Hier entscheidet ein Mensch. Dort hängen später Kapazität, Zeit und rechtliche Verantwortung.", "b": "In BPMN heißt das User Task."}], "live": "", "liveName": "", "liveDaten": null}, {"id": "22", "bild": "/hefte/folien/tag-26/22.jpg", "daumen": "/hefte/folien/tag-26/t22.jpg", "label": "Folie 22/38", "titel": "Bahnen zeigen, wo die Zeit verloren geht", "kern": "Der stärkste Moment des Tages: 12 Minuten Arbeit, 5 Tage Durchlauf. Der Unterschied steckt vollständig in den vier Übergaben.", "frage": "Wenn wir die 12 Minuten komplett automatisieren: Wie lang ist der Durchlauf dann?", "hinweis": "", "fun": "Tagebuch der Rechnung 0815: „Fünf Tage unterwegs. Zwölf Minuten hat sich jemand um mich gekümmert. Den Rest der Woche war ich ein ungelesener Anhang.“", "notiz": "Der stärkste Moment des Blocks. 12 Minuten Arbeit, 5 Tage Durchlauf — der Unterschied steckt vollständig in den vier Übergaben. Wer nur die Bearbeitungszeit automatisiert, verändert an der Durchlaufzeit nichts.", "orte": [{"x": 38.83, "y": 13.69, "w": 6.56, "h": 2.82, "t": "Übergabe", "e": "Jeder Pfeil über eine Bahngrenze. Dazu gehören zusammenstellen, weiterleiten, warten, erinnern.", "b": ""}, {"x": 5.42, "y": 83.94, "w": 15.87, "h": 2.63, "t": "Bearbeitungszeit", "e": "Wie lange wirklich jemand daran arbeitet.", "b": ""}, {"x": 52.34, "y": 83.94, "w": 13.5, "h": 2.63, "t": "Durchlaufzeit", "e": "Vom Anfang bis zum Ende, inklusive Warten. 1,5 + 2 + 0,5 + 1 = 5 Tage.", "b": "Bei 8-Stunden-Tagen: 1 Minute Arbeit, 200 Minuten Warten."}, {"x": 60.81, "y": 70.02, "w": 6.38, "h": 2.34, "t": "Die Raute", "e": "Detektivfrage: Sie hat nur einen, unbeschrifteten Ausgang. Folie 21 verlangt aber beschriftete. Was passiert unter 1.000 €?", "b": ""}], "live": "bahnen", "liveName": "Live: Bahnen", "liveDaten": null}, {"id": "23", "bild": "/hefte/folien/tag-26/23.jpg", "daumen": "/hefte/folien/tag-26/t23.jpg", "label": "Folie 23/38", "titel": "Was die Bahnen-Ansicht bedeutet", "kern": "Drei Befunde, die man ohne Bahnen nicht sieht. Der wichtigste Satz steht unten.", "frage": "", "hinweis": "", "fun": "Beim Arzt: zwei Stunden Wartezimmer, fünf Minuten Behandlung. Wer die Behandlung halbiert, ist immer noch fast zwei Stunden da.", "notiz": "Die praktische Konsequenz unten ist der wichtigste Satz: Der wertvollste Schritt entfällt sehr oft einfach.", "orte": [{"x": 7.08, "y": 30.6, "w": 20.16, "h": 3.31, "t": "Warten statt Arbeiten", "e": "Gestern haben wir Bearbeitungszeit gerechnet. Was das Geschäft stört, ist oft die Durchlaufzeit.", "b": ""}, {"x": 39.66, "y": 61.35, "w": 12.8, "h": 2.63, "t": "Risikoärmster Einstieg", "e": "Weiterleiten und erinnern lässt sich automatisieren, ohne eine einzige fachliche Entscheidung anzutasten.", "b": ""}, {"x": 67.71, "y": 50.79, "w": 13.6, "h": 2.63, "t": "Wer nachträglich auftaucht", "e": "Eine Abteilung, die in Monat vier sagt: „Das müsst ihr aber auch noch mit uns klären.“", "b": ""}, {"x": 44.34, "y": 77.85, "w": 14.38, "h": 2.82, "t": "Die erste Frage", "e": "Der wertvollste Schritt entfällt sehr oft einfach.", "b": "Wenn das Formular zum dritten Mal unterschrieben wird, liest es niemand mehr."}], "live": "bahnen", "liveName": "Live: Bahnen", "liveDaten": null}, {"id": "24", "bild": "/hefte/folien/tag-26/24.jpg", "daumen": "/hefte/folien/tag-26/t24.jpg", "label": "Folie 24/38", "titel": "Wann lohnt sich vollständiges BPMN?", "kern": "Die schlanke Variante ist der Normalfall. Die Faustregel beendet die meisten Werkzeugdiskussionen.", "frage": "", "hinweis": "", "fun": "", "notiz": "Die schlanke Variante ist der Normalfall. Die Faustregel unten laut vorlesen — sie beendet die meisten Werkzeugdiskussionen.", "orte": [{"x": 48.93, "y": 43.76, "w": 10.07, "h": 2.63, "t": "Zwei Wahrheiten", "e": "Dann weiß niemand mehr, welche Darstellung gilt.", "b": ""}, {"x": 80.75, "y": 50.52, "w": 8.51, "h": 2.63, "t": "Versionierung", "e": "Jede Änderung wird nachvollziehbar gespeichert.", "b": ""}, {"x": 52.19, "y": 60.88, "w": 20.08, "h": 2.5, "t": "Ausführbar", "e": "Das Diagramm ist selbst das Programm. Ein eigenes Projekt, nicht nebenbei.", "b": ""}, {"x": 7.08, "y": 79.3, "w": 10.47, "h": 2.41, "t": "Die Faustregel", "e": "So viel Notation, wie die Person mit dem wenigsten Vorwissen im Raum lesen kann. Laut vorlesen.", "b": ""}], "live": "", "liveName": "", "liveDaten": null}, {"id": "25", "bild": "/hefte/folien/tag-26/25.jpg", "daumen": "/hefte/folien/tag-26/t25.jpg", "label": "Folie 25/38", "titel": "Arbeitsauftrag 02: Ist-Prozess in Bahnen", "kern": "Jetzt eure Tatortskizze: Wer tut es, und wie lange wird dazwischen gewartet?", "frage": "Wer hat das schlimmste Verhältnis? Und an welcher Übergabe hängt der größte Anteil?", "hinweis": "", "fun": "In fast jeder Gruppe gibt es einen Fall mit 1 zu 50 oder schlechter. Heute wird der gekürt.", "notiz": "Herumgehen und nach der Differenz fragen. In fast jeder Gruppe gibt es einen Fall mit dem Verhältnis 1 zu 50 oder schlechter. Diesen Fall im Plenum vorstellen lassen.", "orte": [{"x": 18.14, "y": 41.35, "w": 9.06, "h": 2.63, "t": "Höchstens fünf", "e": "Mehr Bahnen, und die Skizze liest niemand mehr.", "b": ""}, {"x": 56.57, "y": 57.18, "w": 7.17, "h": 2.63, "t": "Schätzen erlaubt", "e": "Hier darf geschätzt werden, solange du es dazuschreibst. Gemessen wird später.", "b": ""}], "live": "bahnen", "liveName": "Live: Bahnen", "liveDaten": null}, {"id": "26", "bild": "/hefte/folien/tag-26/26.jpg", "daumen": "/hefte/folien/tag-26/t26.jpg", "label": "Folie 26/38", "titel": "Ist und Soll strikt trennen", "kern": "Erst aufnehmen, was ist. Erst danach überlegen, was sein soll.", "frage": "", "hinweis": "", "fun": "Wer beim Vorher-Foto den Bauch einzieht, sieht nach drei Monaten keinen Fortschritt.", "notiz": "Der häufigste Fehler: Der Ist-Prozess wird schöner aufgeschrieben, als er ist, weil niemand als schlecht organisiert dastehen will. Dagegen hilft nur, die Aufnahme ausdrücklich als Bestandsaufnahme zu rahmen.", "orte": [{"x": 32.28, "y": 36.08, "w": 9.83, "h": 2.72, "t": "Zettelwirtschaft", "e": "Gehört alles in den Ist-Prozess, ohne Wertung. Auch die Datei auf dem Desktop.", "b": ""}, {"x": 70.53, "y": 40.25, "w": 20.8, "h": 2.72, "t": "Bewusst manuell", "e": "Nicht alles muss automatisiert werden. Auch das ist eine Entscheidung im Soll.", "b": ""}, {"x": 9.55, "y": 74.14, "w": 5.74, "h": 2.72, "t": "Die Differenz", "e": "Der Unterschied zwischen Ist und Soll ist der eigentliche Projektinhalt und die Grundlage für den Preis.", "b": ""}, {"x": 52.6, "y": 81.73, "w": 12.54, "h": 2.72, "t": "Bestandsaufnahme", "e": "So ankündigen, nicht als Bewertung. Sonst wird alles schöner erzählt.", "b": ""}], "live": "", "liveName": "", "liveDaten": null}, {"id": "27", "bild": "/hefte/folien/tag-26/27.jpg", "daumen": "/hefte/folien/tag-26/t27.jpg", "label": "Folie 27/38", "titel": "Schritt Null", "kern": "Der übersprungene Schritt Null: Erst reparieren, dann automatisieren. Unbequem, spart aber Monate.", "frage": "Müsste euer Prozess vorher repariert werden?", "hinweis": "", "fun": "Wer in die falsche Richtung fährt, kommt mit einem schnelleren Auto nur schneller falsch an.", "notiz": "Der übersprungene Schritt Null. Punktuelle KI-Unterstützung auf einem instabilen Grundprozess erzeugt schnellere Fehler, keine besseren Ergebnisse. Wenn die Aufnahme einen kaputten Prozess zutage fördert, lautet die Reihenfolge: erst reparieren, dann automatisieren. Das ist unbequem und spart Monate.", "orte": [{"x": 5.21, "y": 35.2, "w": 11.77, "h": 2.41, "t": "Schritt Null", "e": "KI auf einem instabilen Ablauf erzeugt schnellere Fehler, keine besseren Ergebnisse.", "b": ""}], "live": "", "liveName": "", "liveDaten": null}, {"id": "28", "bild": "/hefte/folien/tag-26/28.jpg", "daumen": "/hefte/folien/tag-26/t28.jpg", "label": "Folie 28/38", "titel": "Arbeitsauftrag 03: SOP schreiben", "kern": "SOP heißt Standard Operating Procedure. Maßstab: Eine neue Kollegin könnte es ohne Nachfrage ausführen.", "frage": "", "hinweis": "", "fun": "Der Zettel für die Katzenbetreuung: „Katze füttern“ reicht nicht. „Morgens um 8 eine halbe Dose. Frisst sie nicht: abwarten, sie ist beleidigt.“ Das ist ein SOP.", "notiz": "Beim Gegenlesen die Regel laut ansagen: nicht diskutieren, nur markieren. Jede Markierung ist entweder eine fehlende Regel oder eine noch nicht erfasste Ausnahme — beides wandert in Block 4.", "orte": [{"x": 31.0, "y": 37.83, "w": 11.9, "h": 2.63, "t": "Rolle und System", "e": "Wer tut es, und womit? „Ranking prüfen“ lässt beides offen.", "b": ""}, {"x": 9.17, "y": 53.85, "w": 7.29, "h": 2.63, "t": "Wartezeit als Schritt", "e": "Sonst verschwindet genau das, was später der größte Hebel ist.", "b": ""}, {"x": 9.17, "y": 67.0, "w": 19.4, "h": 2.63, "t": "Nur markieren", "e": "Laut ansagen. Sonst erklärt die eine Person der anderen ihren Prozess, statt ihn zu verbessern.", "b": ""}, {"x": 39.41, "y": 73.66, "w": 9.21, "h": 2.63, "t": "Fehlende Regel", "e": "Die Markierung ist entweder das oder eine noch nicht erfasste Ausnahme. Beides wandert in Block 4.", "b": ""}], "live": "", "liveName": "", "liveDaten": null}, {"id": "29", "bild": "/hefte/folien/tag-26/29.jpg", "daumen": "/hefte/folien/tag-26/t29.jpg", "label": "Folie 29/38", "titel": "Abschnitt 5: Scope und Kriterien", "kern": "Abschnitt 5: Was gehört dazu, was nicht, und woran messt ihr in sechs Monaten den Erfolg?", "frage": "", "hinweis": "", "fun": "", "notiz": "Letzter Abschnitt: Was gehört dazu, was nicht — und woran man in sechs Monaten misst, ob es funktioniert hat.", "orte": [], "live": "", "liveName": "", "liveDaten": null}, {"id": "30", "bild": "/hefte/folien/tag-26/30.jpg", "daumen": "/hefte/folien/tag-26/t30.jpg", "label": "Folie 30/38", "titel": "Scope: rein, raus, Annahmen", "kern": "Die Out-of-Scope-Liste ist der wichtigere Teil. Sie verhindert die Diskussion in Monat drei.", "frage": "", "hinweis": "", "fun": "„Ach, und die Decke? Und der Flur wäre auch schön.“ Ohne Liste wird es Streit. Mit Liste wird es ein neues Angebot.", "notiz": "Die Out-of-Scope-Liste ist der wichtigere Teil — sie verhindert die Diskussion, die sonst in Monat drei kommt.", "orte": [{"x": 7.19, "y": 25.85, "w": 7.19, "h": 2.42, "t": "In Scope", "e": "So konkret, dass du an einem einzelnen Fall entscheiden kannst, ob er dazugehört.", "b": ""}, {"x": 37.5, "y": 25.85, "w": 11.24, "h": 2.42, "t": "Out of Scope", "e": "Wird lang und ist trotzdem nie vollständig. Deshalb der Schutzsatz.", "b": ""}, {"x": 44.4, "y": 47.47, "w": 12.45, "h": 2.72, "t": "Der Schutzsatz", "e": "Dieser eine Satz schließt alle Lücken. Einfach übernehmen.", "b": ""}, {"x": 67.81, "y": 43.58, "w": 16.74, "h": 2.72, "t": "Annahmen", "e": "Worauf der Zuschnitt beruht: Daten, Zugänge, Ansprechpersonen, Volumen.", "b": ""}], "live": "spiel", "liveName": "Spiel", "liveDaten": {"titel": "An der Scope-Tür", "optionen": ["Rein", "Raus"], "raenge": [[1.0, "Chefermittlung", "Alles aufgeklärt. Die Akte kann geschlossen werden."], [0.6, "Kommissariat", "Solide Spurensuche. Eine Runde mehr und du leitest das Dezernat."], [0, "Streifendienst", "Jede Ermittlung fängt so an. Schau dir die Erklärungen an und versuch es gleich nochmal."]], "karten": [{"t": "Büromaterial, 240 Euro, mit Bestellnummer", "r": "Rein", "w": "Standardfall. Bitte durchgehen.", "o": null}, {"t": "Druckerwartung, 1.480 Euro, mit Bestellnummer", "r": "Raus", "w": "Über 1.000 Euro. Tut uns leid, die Liste ist die Liste.", "o": null}, {"t": "Projektabrechnung Messestand, 900 Euro", "r": "Raus", "w": "Der Betrag würde passen, aber Projektabrechnungen stehen ausdrücklich draußen.", "o": null}, {"t": "Kaffeebohnen, 86 Euro, ohne Bestellbezug", "r": "Raus", "w": "Auch Kaffee braucht einen Bestellbezug. Das tut weh, ist aber so.",  2.72, "t": "Interne Teams", "e": "Dasselbe in Grün: nicht unbezahlt, sondern nicht eingeplant. Es zeigt sich als Terminüberschreitung.", "b": ""}], "live": "aufwand", "liveName": "Live-Rechner", "liveDaten": null}, {"id": "37", "bild": "/hefte/folien/tag-26/37.jpg", "daumen": "/hefte/folien/tag-26/t37.jpg", "label": "Folie 37/38", "titel": "Arbeitsauftrag 04: Ziel, Scope, Erfolgskriterien", "kern": "Der Teil, an dem sich entscheidet, ob aus der Idee ein Projekt wird.", "frage": "Wer liest seinen Zielsatz vor? Freiwillige zuerst.", "hinweis": "", "fun": "", "notiz": "Der Teil, an dem sich entscheidet, ob aus der Idee ein Projekt wird. Am Ende drei Zielsätze im Plenum vorlesen und gemeinsam schärfen. Freiwillige zuerst.", "orte": [{"x": 36.98, "y": 41.16, "w": 11.36, "h": 2.63, "t": "Der Projektname", "e": "Nennt das Ergebnis, nicht das Werkzeug. „Rechnung in einem Tag“ statt „KI-Rechnungsbot“.", "b": ""}, {"x": 13.85, "y": 47.37, "w": 11.17, "h": 2.63, "t": "Mindestens sechs", "e": "Klingt viel. Die ersten drei fallen allen ein, ab der vierten wird es interessant.", "b": ""}, {"x": 9.17, "y": 66.72, "w": 7.56, "h": 2.63, "t": "Wert heute", "e": "Unbekannt? Dann steht dort, wie der Wert erhoben wird und bis wann.", "b": ""}], "live": "ziel", "liveName": "Mitmachen", "liveDaten": {"bausteine": [["Anteil oder Menge", "70 Prozent", "Wie viel denn? „Mehr“ ist keine Zahl."], ["Fallmenge", "der Rechnungen unter 1.000 Euro ohne Klärungsbedarf", "Alle? Wirklich alle? Auch die von 1987?"], ["Handlung", "werden ohne manuelle Prüfung freigegeben", "Was soll eigentlich passieren?"], ["Kennzahl", "gemessen an der Freigabequote im Monatsbericht", "Woran merkst du es? „Gefühlt besser“ zählt nicht."], ["Zeitpunkt", "ab drei Monaten nach Start", "So kann das Projekt auch 2049 noch erfolgreich werden."]]}}, {"id": "38", "bild": "/hefte/folien/tag-26/38.jpg", "daumen": "/hefte/folien/tag-26/t38.jpg", "label": "Folie 38/38", "titel": "Was heute entstanden ist", "kern": "Der Fall ist jet
