<style>@font-face{font-family:"Archivo";font-style:normal;font-weight:400 800;font-display:swap;src:url(/hefte/assets/fonts/archivo-latin.woff2) format("woff2")}

ß, wird markiert. Heute zeigt sich: Was offen ist, kostet Punkte.", "b": ""}]}, {"id": "e3", "bild": "/hefte/folien/tag-24/53.jpg", "daumen": "/hefte/folien/tag-24/t53.jpg", "label": "Erinnerung 3/4", "titel": "Die Autonomie-Stufen", "kern": "Stufe 0 bis 4 sagt, wie viel das System allein tun darf. Das fließt heute in Risiko und Kosten ein.", "frage": "Welche Stufe habt ihr für euren Standardfall gewählt?", "hinweis": "", "live": "", "notiz": "Kurze Wiederholung von Freitag. Nicht neu erklären, nur Erinnerung wecken und die Frage stellen.", "orte": [{"x": 42.77, "y": 48.59, "w": 13.26, "h": 2.69, "t": "Stufe 2", "e": "Ein Mensch gibt jeden einzelnen Fall frei. Diese Prüfzeit kostet Geld und taucht heute in der Rechnung auf.", "b": ""}, {"x": 60.77, "y": 41.74, "w": 10.24, "h": 2.69, "t": "Stufe 3", "e": "Das System entscheidet, Menschen prüfen Stichproben und Ausnahmen. Oft der Standardfall.", "b": ""}]}, {"id": "e4", "bild": "/hefte/folien/tag-24/64.jpg", "daumen": "/hefte/folien/tag-24/t64.jpg", "label": "Erinnerung 4/4", "titel": "Die Ausschlusskriterien", "kern": "Diese Punkte lassen sich nicht wegrechnen. Heute kommen sie als Filter vor dem Scoring wieder.", "frage": "Ist einer eurer Kandidaten hier schon durchgefallen?", "hinweis": "", "live": "", "notiz": "Kurze Wiederholung von Freitag. Nicht neu erklären, nur Erinnerung wecken und die Frage stellen.", "orte": [{"x": 5.21, "y": 37.7, "w": 26.83, "h": 2.87, "t": "Der Eigentümer", "e": "Ohne benannte Person bemerkt später niemand, wenn etwas schiefläuft.", "b": ""}, {"x": 5.21, "y": 58.81, "w": 24.37, "h": 2.87, "t": "Richtiges Ergebnis", "e": "Ohne Sollergebnis gibt es nichts, wogegen man testen kann.", "b": ""}]}, {"id": "1", "bild": "/hefte/folien/tag-25/01.jpg", "daumen": "/hefte/folien/tag-25/t01.jpg", "label": "Folie 1/29", "titel": "Bewerten, rechnen, priorisieren", "kern": "Teil 2 von 5. Heute wird aus den drei Kandidaten vom Freitag eine begründete Entscheidung.", "frage": "Wer hat echte Volumenzahlen mitgebracht?", "hinweis": "", "live": "", "notiz": "Auftakt Block 2 von 5. Voraussetzung: drei Steckbriefe aus Block 1 liegen ausgefüllt vor. Kurz abfragen, wer echte Volumenzahlen mitgebracht hat.", "orte": [{"x": 5.21, "y": 17.28, "w": 47.28, "h": 9.63, "t": "Der Dreiklang", "e": "Bewerten heißt Punkte vergeben, priorisieren heißt Reihenfolge festlegen, rechnen heißt prüfen, ob es sich lohnt.", "b": ""}, {"x": 9.82, "y": 40.37, "w": 13.86, "h": 3.7, "t": "Kandidatenfeld", "e": "Eure drei Use-Case-Ideen aus den Steckbriefen. Noch ist keine entschieden.", "b": ""}]}, {"id": "2", "bild": "/hefte/folien/tag-25/02.jpg", "daumen": "/hefte/folien/tag-25/t02.jpg", "label": "Folie 2/29", "titel": "Abschnitt 1: Bewerten", "kern": "Abschnitt 1: Wir bewerten nicht nach Gefühl, sondern nach vier festen Kriterien.", "frage": "", "hinweis": "", "live": "", "notiz": "Einstieg: Bewertet wird nicht nach Gefühl, sondern nach vier Kriterien. Kurz halten.", "orte": []}, {"id": "3", "bild": "/hefte/folien/tag-25/03.jpg", "daumen": "/hefte/folien/tag-25/t03.jpg", "label": "Folie 3/29", "titel": "Zwei Fragen, die oft verwechselt werden", "kern": "Zwei verschiedene Fragen: Was kommt zuerst? Und: Lohnt es sich überhaupt?", "frage": "Welche der beiden Fragen stellt man in der Praxis meist zuerst – und warum ist das gefährlich?", "hinweis": "", "live": "", "notiz": "Diese Unterscheidung trägt den ganzen Block: erst das Scoring über alle drei Kandidaten, dann die Rechnung für den stärksten. Wer sie vermischt, bekommt entweder eine sortierte Liste unwirtschaftlicher Vorhaben oder einen guten Fall ohne Vergleich.", "orte": [{"x": 7.29, "y": 26.78, "w": 21.57, "h": 2.41, "t": "Priorisierung", "e": "Sortieren: Was machen wir zuerst? Auch der Erste auf der Liste kann sich am Ende nicht lohnen.", "b": "Drei Autos vergleichen und einen Favoriten finden."}, {"x": 21.9, "y": 80.72, "w": 4.95, "h": 2.72, "t": "Scoring", "e": "Punkte nach festen Kriterien vergeben, damit man Äpfel und Birnen vergleichen kann.", "b": "Wie Sterne beim Hotelvergleich."}, {"x": 52.76, "y": 26.78, "w": 26.49, "h": 2.41, "t": "Wirtschaftlichkeit", "e": "Bleibt nach allen Kosten etwas übrig – und ab wann?", "b": "Kann ich mir den Favoriten mit Versicherung und Sprit leisten?"}, {"x": 73.06, "y": 31.53, "w": 11.69, "h": 3.31, "t": "Gesamtkosten", "e": "Nicht nur der Kaufpreis, sondern auch alles, was jeden Monat weiterläuft.", "b": ""}]}, {"id": "4", "bild": "/hefte/folien/tag-25/04.jpg", "daumen": "/hefte/folien/tag-25/t04.jpg", "label": "Folie 4/29", "titel": "Die vier Kernkriterien", "kern": "Alle Kandidaten werden an denselben vier Kriterien gemessen. Nur so lässt sich vergleichen.", "frage": "", "hinweis": "", "live": "", "notiz": "Die vier Kriterien nur benennen, nicht diskutieren. Die Prüffragen kommen auf der nächsten Folie.", "orte": [{"x": 6.98, "y": 32.55, "w": 5.67, "h": 3.31, "t": "Nutzen", "e": "Wie viel Mehrwert entsteht? In Euro, aber auch in Qualität.", "b": ""}, {"x": 29.69, "y": 32.55, "w": 15.26, "h": 3.31, "t": "Datenverfügbarkeit", "e": "Sind die Daten da, zugänglich und brauchbar? Ohne Daten keine Automation.", "b": "Rechnungen als PDF im Postfach: da, aber uneinheitlich."}, {"x": 52.4, "y": 32.55, "w": 12.9, "h": 7.1, "t": "Komplexität", "e": "Wie viele Systeme, Sonderfälle und Beteiligte hängen dran?", "b": ""}, {"x": 75.1, "y": 32.55, "w": 4.97, "h": 3.31, "t": "Risiko", "e": "Was passiert, wenn etwas schiefgeht – rechtlich, organisatorisch, inhaltlich?", "b": ""}]}, {"id": "5", "bild": "/hefte/folien/tag-25/05.jpg", "daumen": "/hefte/folien/tag-25/t05.jpg", "label": "Folie 5/29", "titel": "Was hinter jedem Kriterium zu prüfen ist", "kern": "Hinter jedem Kriterium stehen konkrete Fragen. Wer sie nicht beantworten kann, rät nur.", "frage": "", "hinweis": "", "live": "", "notiz": "Diese Prüffragen sind der eigentliche Inhalt der Bewertung. Wer eine Frage nicht beantworten kann, hat die Antwort auch nicht in der Punktzahl.", "orte": [{"x": 75.44, "y": 32.88, "w": 12.86, "h": 2.41, "t": "Nutzbare Zeit", "e": "Gesparte Minuten bringen nur etwas, wenn daraus echte freie Zeit wird.", "b": "Zwei Minuten täglich bei 200 Personen helfen praktisch keinem."}, {"x": 80.26, "y": 42.98, "w": 9.39, "h": 2.41, "t": "Personenbezug", "e": "Lassen sich die Daten einer bestimmten Person zuordnen? Dann gilt der Datenschutz.", "b": "Name und E-Mail in einer Anfrage."}, {"x": 47.49, "y": 53.07, "w": 13.03, "h": 2.41, "t": "Entscheidungszweige", "e": "Wie viele „wenn, dann“ hat der Ablauf? Jeder Zweig macht ihn aufwendiger.", "b": ""}, {"x": 47.79, "y": 63.16, "w": 7.67, "h": 2.41, "t": "Reversibilität", "e": "Lässt sich ein Fehler rückgängig machen?", "b": "Falsche Tabellenzeile: ja. Verschickte Mail: nein."}, {"x": 68.62, "y": 63.16, "w": 6.53, "h": 2.41, "t": "Reputation", "e": "Der gute Ruf. Ein peinlicher Fehler nach außen kostet mehr als Geld.", "b": ""}]}, {"id": "6", "bild": "/hefte/folien/tag-25/06.jpg", "daumen": "/hefte/folien/tag-25/t06.jpg", "label": "Folie 6/29", "titel": "Vor jeder Bewertung", "kern": "Die wichtigste Regel des Tages: 5 Punkte sind immer gut für das Projekt.", "frage": "Ein Fall ist sehr riskant. Wie viele Punkte bekommt er bei Risikoarmut?", "hinweis": "", "live": "", "notiz": "Der Hinweis, der jede Bewertung trägt. Im Heft ist die Leserichtung in Abschnitt 2.1 bereits so angelegt — hier nur bewusst machen, warum das so ist.", "orte": [{"x": 45.99, "y": 45.34, "w": 23.54, "h": 8.67, "t": "Leserichtung", "e": "Das ist der Rechenfehler, den fast jede Gruppe macht: Risiko 5 als „sehr riskant“ eintragen. Dann gewinnt der gefährlichste Fall.", "b": "Fünf Sterne für „Lärm“ – und das lauteste Hotel gewinnt."}]}, {"id": "7", "bild": "/hefte/folien/tag-25/07.jpg", "daumen": "/hefte/folien/tag-25/t07.jpg", "label": "Folie 7/29", "titel": "Was 1 Punkt und was 5 Punkte bedeutet", "kern": "So wird aus der Regel eine Skala. Darum heißen zwei Kriterien hier Einfachheit und Risikoarmut.", "frage": "", "hinweis": "", "live": "scoring", "notiz": "Das ist die Tabelle aus Abschnitt 2.1 des Arbeitshefts. Wichtig ist die dritte und vierte Zeile: Einfachheit und Risikoarmut messen Komplexität und Risiko — nur in der Leserichtung „hoher Wert = gut“.", "orte": [{"x": 50.07, "y": 15.83, "w": 7.71, "h": 2.78, "t": "Einfachheit", "e": "Komplexität, nur umgedreht: 5 Punkte heißt ein System und klare Regeln.", "b": ""}, {"x": 61.02, "y": 15.83, "w": 8.23, "h": 2.78, "t": "Risikoarmut", "e": "Risiko, nur umgedreht: 5 Punkte heißt Fehler bleiben folgenlos.", "b": ""}, {"x": 51.08, "y": 31.5, "w": 14.31, "h": 2.41, "t": "Die 3 beim Nutzen", "e": "Man merkt es, kann es aber noch nicht in Euro sagen. Ehrliche Mitte statt geschönter 5.", "b": ""}]}, {"id": "8", "bild": "/hefte/folien/tag-25/08.jpg", "daumen": "/hefte/folien/tag-25/t08.jpg", "label": "Folie 8/29", "titel": "Gewichtung für ein Erstprojekt", "kern": "Nicht alles zählt gleich. Fürs erste Projekt gilt: Es muss fertig werden.", "frage": "Wann würdet ihr Risikoarmut höher gewichten?", "hinweis": "", "live": "scoring", "notiz": "Eine eigene Gewichtung ist erlaubt, aber sie muss begründet sein. Nachsetzen: Das erste Projekt muss nicht das wertvollste sein, sondern das, das fertig wird.", "orte": [{"x": 5.21, "y": 34.12, "w": 5.67, "h": 3.31, "t": "Warum 40 %?", "e": "Auch ein kleines Projekt muss sichtbar etwas bringen. Die übrigen 60 % sorgen dafür, dass es fertig wird.", "b": ""}, {"x": 20.62, "y": 80.63, "w": 31.95, "h": 2.69, "t": "Der Merksatz", "e": "Ein fertiges kleines Projekt schafft Vertrauen. Ein großes unfertiges schafft Ärger.", "b": "Erst fünf Kilometer laufen, dann der Marathon."}]}, {"id": "9", "bild": "/hefte/folien/tag-25/09.jpg", "daumen": "/hefte/folien/tag-25/t09.jpg", "label": "Folie 9/29", "titel": "Ausschlusskriterien vor dem Scoring", "kern": "Bevor gerechnet wird, kommt der Filter. Ein Ausschluss ist keine schlechte Note, sondern das Ende der Prüfung.", "frage": "", "hinweis": "Am Freitag waren es fünf Punkte. Der fünfte gilt weiter: Wird der Ablauf gerade umgestellt, erst den Zielablauf klären.", "live": "", "notiz": "Bekannt aus Block 1, hier aber als Filter vor dem Rechnen. Ein Ausschluss ist keine schlechte Punktzahl — er beendet die Prüfung.", "orte": [{"x": 71.8, "y": 30.44, "w": 16.88, "h": 2.72, "t": "Datenbeschaffung", "e": "Wenn die Daten erst gesammelt werden müssen, ist das ein eigenes Projekt mit eigener Entscheidung.", "b": ""}, {"x": 40.72, "y": 61.55, "w": 7.97, "h": 2.72, "t": "Sollergebnis", "e": "Was wäre richtig? Ohne diese Antwort lässt sich nichts testen.", "b": "Zwei Erfahrene entscheiden denselben Fall verschieden: Es fehlt eine Regel."}]}, {"id": "10", "bild": "/hefte/folien/tag-25/10.jpg", "daumen": "/hefte/folien/tag-25/t10.jpg", "label": "Folie 10/29", "titel": "Arbeitsauftrag 01: Kandidaten bewerten", "kern": "Jetzt selbst bewerten: drei Kandidaten mal vier Kriterien, zwölf Zahlen, zwölf Sätze.", "frage": "", "hinweis": "", "live": "scoring", "notiz": "Konsequent zurückgeben, wenn eine Bewertung ohne Begründungssatz dasteht. Der Satz ist die Bewertung — die Zahl ist nur ihre Abkürzung.", "orte": [{"x": 15.83, "y": 35.07, "w": 11.33, "h": 2.72, "t": "Der Begründungssatz", "e": "Der Satz ist die eigentliche Bewertung, die Zahl nur die Abkürzung. Er zeigt, ob jemand wirklich nachgedacht hat.", "b": "„4 Punkte, weil 180 Anfragen pro Monat je 7 Minuten sparen.“"}, {"x": 37.75, "y": 20.72, "w": 6.38, "h": 2.69, "t": "Gewichtet rechnen", "e": "Punkte mal Gewicht, dann alles zusammenzählen: 4 × 0,40 + 4 × 0,25 + 3 × 0,20 + 4 × 0,15 = 3,8.", "b": ""}]}, {"id": "11", "bild": "/hefte/folien/tag-25/11.jpg", "daumen": "/hefte/folien/tag-25/t11.jpg", "label": "Folie 11/29", "titel": "Abschnitt 2: Priorisieren", "kern": "Abschnitt 2: Eine Punktzahl sagt noch nicht, womit man anfängt.", "frage": "", "hinweis": "", "live": "", "notiz": "Von der Bewertung zur Reihenfolge: Punktzahl allein sagt nicht, womit man anfängt.", "orte": []}, {"id": "12", "bild": "/hefte/folien/tag-25/12.jpg", "daumen": "/hefte/folien/tag-25/t12.jpg", "label": "Folie 12/29", "titel": "Wert-Aufwand-Matrix", "kern": "Vier Felder, vier klare Konsequenzen. Wert nach oben, Aufwand nach rechts.", "frage": "Wer hat einen Kandidaten im Feld „Streichen“?", "hinweis": "Achtung beim Rechnen: Aufwand = 12 − Einfachheit − Risikoarmut, weil diese beiden umgedreht bewertet wurden. Vorschlag: Wert ab 7 ist hoch, Aufwand bis 5 ist gering.", "live": "scoring", "notiz": "Die Gruppe die eigenen drei Kandidaten in die Felder einordnen lassen — mündlich, eine Minute. Das untere rechte Feld ist das wichtigste.", "orte": [{"x": 11.77, "y": 29.6, "w": 12.47, "h": 3.7, "t": "Sofort starten", "e": "Viel Wert bei wenig Aufwand. Hier liegt das Erstprojekt.", "b": "Die Spülmaschine reparieren."}, {"x": 54.74, "y": 29.6, "w": 30.46, "h": 3.7, "t": "In Etappen", "e": "Lohnt sich, ist aber zu groß für einen Wurf. In Teile schneiden, die einzeln etwas bringen.", "b": "Das Bad renovieren."}, {"x": 11.77, "y": 59.78, "w": 29.59, "h": 3.7, "t": "Nebenbei", "e": "Kostet wenig, bringt wenig. Kein Projekt draus machen.", "b": "Fotos sortieren."}, {"x": 54.84, "y": 59.97, "w": 8.85, "h": 3.7, "t": "Streichen", "e": "Das wichtigste Feld. Es macht Zeit und Geld frei. Eine gute Entscheidung, keine Niederlage.", "b": "Einen Teppich von Hand knüpfen."}]}, {"id": "13", "bild": "/hefte/folien/tag-25/13.jpg", "daumen": "/hefte/folien/tag-25/t13.jpg", "label": "Folie 13/29", "titel": "Reihenfolge der ersten drei Projekte", "kern": "Die ersten drei Projekte haben je eine Aufgabe. Nicht die höchste Punktzahl kommt zuerst.", "frage": "", "hinweis": "", "live": "", "notiz": "Nachsetzen: Diese Reihenfolge ist nicht wertmaximierend, sondern abschlussmaximierend. Wer mit dem größten Fall anfängt, hat nach sechs Monaten nichts zu zeigen.", "orte": [{"x": 7.19, "y": 36.5, "w": 15.06, "h": 3.33, "t": "Vertrauensaufbau", "e": "Klein und sichtbar. Danach glaubt die Organisation daran, dass es funktioniert.", "b": ""}, {"x": 38.26, "y": 36.5, "w": 7.99, "h": 3.33, "t": "Substanz", "e": "Jetzt der wirtschaftlich stärkste Fall, weil das Team und die Führung bereit sind.", "b": ""}, {"x": 69.34, "y": 36.5, "w": 4.97, "h": 3.33, "t": "Hebel", "e": "Nutzt dieselben Daten und Anbindungen wie vorher. Das Gleiche kostet plötzlich viel weniger.", "b": ""}, {"x": 56.28, "y": 81.37, "w": 15.35, "h": 2.69, "t": "Abschlussmaximierend", "e": "Die Reihenfolge, die am sichersten zu fertigen Projekten führt – nicht die mit dem höchsten Wert auf dem Papier.", "b": "Wer mit dem größten Fall anfängt, hat nach sechs Monaten nichts vorzuzeigen."}]}, {"id": "14", "bild": "/hefte/folien/tag-25/14.jpg", "daumen": "/hefte/folien/tag-25/t14.jpg", "label": "Folie 14/29", "titel": "Arbeitsauftrag 02: Matrix und Haupt-Use-Case", "kern": "Der wichtigste Schnitt des Tages: Ab jetzt wird nur noch mit einem Fall gerechnet.", "frage": "", "hinweis": "", "live": "scoring", "notiz": "Kurzer Auftrag, aber der wichtigste Schnitt des Tages: Ab hier wird nur noch mit einem Fall gerechnet. Wer sich nicht entscheiden kann, rechnet später drei halbe Business Cases.", "orte": [{"x": 18.68, "y": 14.71, "w": 20.71, "h": 5.0, "t": "Haupt-Use-Case", "e": "Der eine Fall, den wir durchrechnen. Wer sich nicht entscheidet, rechnet später drei halbe Rechnungen.", "b": ""}]}, {"id": "15", "bild": "/hefte/folien/tag-25/15.jpg", "daumen": "/hefte/folien/tag-25/t15.jpg", "label": "Folie 15/29", "titel": "Abschnitt 3: Der Business Case", "kern": "Abschnitt 3: Jetzt wird gerechnet. Ab hier braucht jede Aussage eine Zahl mit Herkunft.", "frage": "", "hinweis": "", "live": "", "notiz": "Jetzt wird gerechnet. Ab hier braucht jede Aussage eine Zahl mit Herkunft.", "orte": []}, {"id": "16", "bild": "/hefte/folien/tag-25/16.jpg", "daumen": "/hefte/folien/tag-25/t16.jpg", "label": "Folie 16/29", "titel": "Die drei Kennzahlen", "kern": "Drei Zahlen, drei Fragen. In allen stecken die laufenden Kosten.", "frage": "Jemand sagt: „256 % ROI!“ Was fragt ihr zuerst?", "hinweis": "", "live": "bc", "notiz": "Alle drei Zahlen am selben Beispiel durchrechnen — das ist der Punkt. Die Falle bei der Amortisation laut vorführen: mit Bruttonutzen gerechnet sind es 8 statt 10 Monate. Laufende Kosten gehören in jede der drei Zahlen.", "orte": [{"x": 6.56, "y": 24.0, "w": 7.7, "h": 2.41, "t": "Bruttonutzen", "e": "Was der Fall jeden Monat einbringt, bevor Kosten abgezogen sind.", "b": "Kaffeemaschine: 150 € gekaufter Kaffee fällt weg."}, {"x": 43.52, "y": 23.97, "w": 7.84, "h": 2.41, "t": "Nettonutzen", "e": "Was wirklich übrig bleibt: Bruttonutzen minus laufende Kosten.", "b": "150 € minus 30 € Bohnen = 120 €."}, {"x": 6.77, "y": 36.25, "w": 7.88, "h": 3.31, "t": "ROI", "e": "Return on Investment: Wie viel kommt im Verhältnis zum Einsatz zurück? Nie ohne Zeitraum nennen.", "b": "1.200 € Maschine: nach 12 Monaten 20 %."}, {"x": 37.01, "y": 36.25, "w": 10.09, "h": 3.31, "t": "Amortisation", "e": "Ab wann ist die Investition wieder drin? Ab da verdient der Fall.", "b": "1.200 € ÷ 120 € = 10 Monate."}, {"x": 67.26, "y": 36.25, "w": 13.56, "h": 3.31, "t": "TCO", "e": "Total Cost of Ownership: alle Kosten über die ganze Nutzungsdauer. Die Zahl, die in Angeboten am häufigsten fehlt.", "b": "1.200 € + 30 € × 36 = 2.280 €."}, {"x": 6.77, "y": 83.8, "w": 10.17, "h": 5.65, "t": "Die Falle", "e": "Mit dem Bruttonutzen käme man auf 8 statt 10 Monate. Das sieht besser aus, stimmt aber nicht.", "b": ""}]}, {"id": "17", "bild": "/hefte/folien/tag-25/17.jpg", "daumen": "/hefte/folien/tag-25/t17.jpg", "label": "Folie 17/29", "titel": "Kosten, die regelmäßig vergessen werden", "kern": "Einmalige Kosten fallen allen ein. Die rechte Spalte wird vergessen – und läuft jeden Monat weiter.", "frage": "Was fehlt in eurer eigenen Schätzung noch?", "hinweis": "", "live": "", "notiz": "Diese beiden Spalten laut durchgehen und die Gruppe abhaken lassen, was in ihrer eigenen Schätzung fehlt. Meistens fehlt die halbe rechte Spalte.", "orte": [{"x": 7.19, "y": 44.6, "w": 11.89, "h": 2.72, "t": "Datenaufbereitung", "e": "Daten sammeln, säubern, vereinheitlichen. Oft der größte versteckte Posten.", "b": ""}, {"x": 20.36, "y": 69.33, "w": 21.22, "h": 2.72, "t": "Datenschutz-Folgenabschätzung", "e": "Pflichtprüfung, wenn die Verarbeitung für Personen riskant sein kann.", "b": ""}, {"x": 52.66, "y": 44.97, "w": 14.48, "h": 2.72, "t": "Monitoring", "e": "Jemand schaut laufend, ob der Ablauf noch richtig arbeitet.", "b": ""}, {"x": 52.66, "y": 57.38, "w": 22.18, "h": 2.72, "t": "Menschliche Prüfung", "e": "Auch automatisiert prüft noch jemand. Das ist Arbeitszeit. Aber nicht doppelt zählen, wenn es schon beim Nutzen abgezogen ist.", "b": ""}, {"x": 65.54, "y": 63.59, "w": 4.09, "h": 2.72, "t": "Audit", "e": "Geordnete Prüfung, ob alle Regeln eingehalten werden.", "b": ""}]}, {"id": "18", "bild": "/hefte/folien/tag-25/18.jpg", "daumen": "/hefte/folien/tag-25/t18.jpg", "label": "Folie 18/29", "titel": "Drei Erfahrungswerte", "kern": "Drei Richtwerte zum Gegenprüfen. Aus der Praxis, nicht wissenschaftlich gemessen.", "frage": "", "hinweis": "", "live": "", "notiz": "Diese drei Werte sind Erfahrungswerte aus der Projektpraxis, keine erhobenen Kennzahlen. So auch benennen.", "orte": [{"x": 7.29, "y": 44.48, "w": 13.98, "h": 2.96, "t": "15–25 %", "e": "Fehlt dieser Posten im Angebot, wird es später teurer.", "b": ""}, {"x": 37.6, "y": 40.78, "w": 14.51, "h": 2.96, "t": "8–16 Stunden", "e": "Ohne Schulung läuft das System, aber niemand nutzt es richtig.", "b": ""}, {"x": 67.92, "y": 40.78, "w": 19.31, "h": 2.96, "t": "20–30 % Puffer", "e": "Schätzungen sind fast immer zu niedrig. Der Puffer ist die Regel.", "b": ""}, {"x": 58.49, "y": 16.57, "w": 14.32, "h": 2.78, "t": "Der Warnhinweis", "e": "Sieht eine Rechnung zu gut aus, fehlt meist etwas.", "b": ""}]}, {"id": "19", "bild": "/hefte/folien/tag-25/19.jpg", "daumen": "/hefte/folien/tag-25/t19.jpg", "label": "Folie 19/29", "titel": "Beispielrechnung Rechnungsfreigabe", "kern": "Die ganze Kette in einem Beispiel: vom Volumen zur Amortisation. Jede Zeile braucht eine Herkunft.", "frage": "Woher stammt bei euch jede Zahl: gemessen, nachgeschlagen oder geschätzt?", "hinweis": "", "live": "bc", "notiz": "Zeile für Zeile mitrechnen lassen. Wichtig ist nicht das Ergebnis, sondern dass jede Zeile eine Herkunft hat: gemessen, nachgeschlagen oder geschätzt.", "orte": [{"x": 6.88, "y": 41.73, "w": 15.36, "h": 2.72, "t": "Automatisierbarer Anteil", "e": "Nicht alles lässt sich automatisieren. 70 % von 800 sind 560 Vorgänge.", "b": ""}, {"x": 6.88, "y": 47.84, "w": 14.76, "h": 2.72, "t": "Restprüfzeit", "e": "Auch ein automatisierter Vorgang braucht noch einen kurzen Blick. Gespart werden also 3,5 statt 4 Minuten.", "b": ""}, {"x": 6.88, "y": 54.22, "w": 6.43, "h": 2.59, "t": "Ersparnis", "e": "560 × 3,5 Minuten ÷ 60 = 32,7 Stunden, gerundet 33.", "b": ""}, {"x": 6.88, "y": 60.16, "w": 8.1, "h": 2.72, "t": "Stundensatz", "e": "Was eine Arbeitsstunde das Unternehmen wirklich kostet, nicht nur der Lohn.", "b": ""}, {"x": 52.19, "y": 41.46, "w": 12.24, "h": 2.72, "t": "Investition", "e": "Alles, was einmal gezahlt wird, bevor es losgeht.", "b": ""}]}, {"id": "20", "bild": "/hefte/folien/tag-25/20.jpg", "daumen": "/hefte/folien/tag-25/t20.jpg", "label": "Folie 20/29", "titel": "Nur zählen, was zählbar wird", "kern": "Drei Arten von Nutzen, nur zwei zählen in der Rechnung.", "frage": "", "hinweis": "", "live": "", "notiz": "Die dritte Spalte ist die häufigste Stelle, an der ein Business Case unglaubwürdig wird. Qualitative Effekte benennen — aber nicht in den ROI rechnen.", "orte": [{"x": 7.19, "y": 25.69, "w": 13.92, "h": 3.31, "t": "Harte Einsparung", "e": "Zeit, die wirklich wegfällt, nicht Zeit, die nur anders verbracht wird.", "b": "Ein wöchentlicher Termin entfällt."}, {"x": 37.5, "y": 25.69, "w": 15.54, "h": 3.31, "t": "Vermiedene Kosten", "e": "Fehler und Nacharbeit, die belegbar weniger werden.", "b": ""}, {"x": 49.76, "y": 31.27, "w": 9.6, "h": 2.72, "t": "Skonto", "e": "Preisnachlass für schnelles Bezahlen. Wer zu spät zahlt, verschenkt ihn.", "b": "2 % von 10.000 € sind 200 €."}, {"x": 67.92, "y": 25.51, "w": 14.51, "h": 3.31, "t": "Qualitative Effekte", "e": "Wichtig für die Entscheidung, aber nicht seriös in Euro. Benennen, nicht rechnen.", "b": ""}, {"x": 57.89, "y": 74.98, "w": 8.43, "h": 2.69, "t": "Verteilte Zeit", "e": "Sieht nach viel aus, fällt aber nie am Stück an. Zwei Minuten früher fertig machen niemanden freier.", "b": ""}]}, {"id": "21", "bild": "/hefte/folien/tag-25/21.jpg", "daumen": "/hefte/folien/tag-25/t21.jpg", "label": "Folie 21/29", "titel": "Arbeitsauftrag 03: Business Case rechnen", "kern": "Jetzt den eigenen Fall rechnen. Die Pflichtspalte ist der Kern des Auftrags.", "frage": "", "hinweis": "", "live": "bc", "notiz": "Die Pflichtspalte „Woher stammt die Zahl?“ ist der Kern dieses Auftrags. Bei jedem Tisch eine Zeile stichprobenartig nachfragen.", "orte": [{"x": 17.48, "y": 61.72, "w": 14.91, "h": 2.62, "t": "Die Pflichtspalte", "e": "Macht sichtbar, wie belastbar die Rechnung ist. Lieber ehrlich „geschätzt“ als eine schöne Zahl ohne Herkunft.", "b": ""}]}, {"id": "22", "bild": "/hefte/folien/tag-25/22.jpg", "daumen": "/hefte/folien/tag-25/t22.jpg", "label": "Folie 22/29", "titel": "Drei Szenarien statt einer Zahl", "kern": "Eine einzelne Zahl täuscht Sicherheit vor. Also dreimal rechnen.", "frage": "", "hinweis": "", "live": "bc", "notiz": "Nachsetzen: Kippt der Fall im konservativen Szenario, ist er kein sicherer Kandidat. Das ist keine Rechenübung, sondern die Entscheidungsgrundlage.", "orte": [{"x": 31.17, "y": 20.09, "w": 7.82, "h": 2.78, "t": "Konservativ", "e": "Vorsichtige Annahmen. Dieses Szenario entscheidet.", "b": "Beispiel: 50 % Anteil, 400 € laufend: rund 19 Monate."}, {"x": 37.5, "y": 30.2, "w": 4.78, "h": 3.33, "t": "Basis", "e": "Die geplanten Annahmen. Das, was man vorträgt.", "b": "70 %, 300 €: rund 10 Monate."}, {"x": 67.81, "y": 30.57, "w": 10.35, "h": 3.33, "t": "Ambitioniert", "e": "Der beste realistische Fall. Eine Obergrenze, kein Plan.", "b": ""}, {"x": 68.97, "y": 77.48, "w": 21.73, "h": 2.69, "t": "Die eigentliche Frage", "e": "Kippt der Fall hier, ist er kein sicherer Kandidat.", "b": ""}]}, {"id": "23", "bild": "/hefte/folien/tag-25/23.jpg", "daumen": "/hefte/folien/tag-25/t23.jpg", "label": "Folie 23/29", "titel": "Faustregel", "kern": "Ein Schnelltest vor dem Rechnen: Lohnt sich die Mühe überhaupt?", "frage": "", "hinweis": "Die Faustregel ist nur ein Schnelltest. Mit 12.000 € Investition und 300 € laufend wären es bei 15 Stunden rund 32 Monate. Der Fall muss also auch klein geschnitten sein.", "live": "", "notiz": "Der Schnelltest vor jedem Rechnen. Wichtig ist der letzte Punkt: Ein Projekt, das mit einem falschen Versprechen startet, wird nach zwölf Monaten an diesem Versprechen gemessen — und scheitert dann, obwohl es funktioniert hat.", "orte": [{"x": 59.31, "y": 26.15, "w": 15.96, "h": 3.52, "t": "Die Grenze", "e": "Darunter trägt sich der Fall selten allein über die Zeitersparnis.", "b": ""}, {"x": 57.32, "y": 78.49, "w": 7.71, "h": 2.72, "t": "Compliance", "e": "Einhaltung von Gesetzen und Regeln. Ein guter Grund für ein Projekt, aber dann ehrlich hinschreiben.", "b": ""}]}, {"id": "24", "bild": "/hefte/folien/tag-25/24.jpg", "daumen": "/hefte/folien/tag-25/t24.jpg", "label": "Folie 24/29", "titel": "Abschnitt 4: Entscheiden", "kern": "Abschnitt 4: Was trägt, was scheitert – und die Entscheidung.", "frage": "", "hinweis": "", "live": "", "notiz": "Letzter Abschnitt: was erfahrungsgemäß trägt, was scheitert — und die Entscheidung mit Abbruchbedingung.", "orte": []}, {"id": "25", "bild": "/hefte/folien/tag-25/25.jpg", "daumen": "/hefte/folien/tag-25/t25.jpg", "label": "Folie 25/29", "titel": "Best Practices", "kern": "Acht Gewohnheiten aus erfolgreichen und gescheiterten Vorhaben. 07 und 08 fehlen in Angeboten fast immer.", "frage": "", "hinweis": "", "live": "", "notiz": "Acht Punkte aus der Auswertung erfolgreicher und gescheiterter Vorhaben. Punkt 07 und 08 sind die, die in Angeboten fast immer fehlen.", "orte": [{"x": 56.46, "y": 40.55, "w": 17.1, "h": 2.78, "t": "Ist-Zustand", "e": "Wer vorher nicht misst, kann hinterher nichts belegen. Das erklärt viele „95 % ohne Effekt“.", "b": ""}, {"x": 56.46, "y": 48.14, "w": 22.97, "h": 2.78, "t": "Im Ablauf", "e": "Was neben dem Alltag läuft, wird vergessen. Es muss dort sein, wo ohnehin gearbeitet wird.", "b": ""}, {"x": 56.46, "y": 55.64, "w": 15.35, "h": 2.78, "t": "Ausnahmen", "e": "Der Standardfall ist leicht. Teuer wird, was niemand bedacht hat.", "b": ""}, {"x": 56.46, "y": 66.66, "w": 22.02, "h": 2.78, "t": "Abbruchbedingung", "e": "Vorher festlegen, wann man aufhört. Sonst läuft ein schlechtes Projekt einfach weiter.", "b": ""}]}, {"id": "26", "bild": "/hefte/folien/tag-25/26.jpg", "daumen": "/hefte/folien/tag-25/t26.jpg", "label": "Folie 26/29", "titel": "Stolpersteine", "kern": "Die rechte Spalte zeigt sich erst nach dem Projekt und ist die teurere.", "frage": "Welcher Stolperstein droht eurem Haupt-Use-Case am ehesten?", "hinweis": "", "live": "", "notiz": "Die rechte Spalte wird erst nach dem Projektende sichtbar — und ist die teurere. Jeden Punkt kurz gegen den eigenen Haupt-Use-Case prüfen lassen.", "orte": [{"x": 51.46, "y": 29.14, "w": 17.97, "h": 2.69, "t": "Pilot", "e": "Der Testbetrieb. Testzugänge und manueller Start sind noch kein echter Betrieb.", "b": ""}, {"x": 51.46, "y": 51.0, "w": 22.46, "h": 2.69, "t": "Aktivität statt Wirkung", "e": "„Zwölf Automatisierungen“ sagt nichts. Besser: gesparte Stunden, weniger Fehler.", "b": ""}, {"x": 51.46, "y": 72.94, "w": 20.65, "h": 2.69, "t": "Eine Person", "e": "Wenn nur eine Person den Ablauf versteht, wird das Risiko nur verlagert.", "b": ""}]}, {"id": "27", "bild": "/hefte/folien/tag-25/27.jpg", "daumen": "/hefte/folien/tag-25/t27.jpg", "label": "Folie 27/29", "titel": "Nicht machen ist ein Ergebnis", "kern": "Ein sauber begründetes Nein ist eines der wertvollsten Ergebnisse des Tages.", "frage": "Wer kommt bei seiner Rechnung auf ein Nein und stellt es vor?", "hinweis": "", "live": "", "notiz": "Wer bei seiner Rechnung auf ein Nein kommt, stellt es im Plenum vor. Das ist die wertvollste Präsentation des Tages und setzt für den Rest des Workshops den Maßstab.", "orte": [{"x": 44.33, "y": 44.89, "w": 21.47, "h": 9.15, "t": "Arbeitsergebnis", "e": "Wer rechnet und zu einem Nein kommt, spart dem Unternehmen Geld und Ärger.", "b": ""}]}, {"id": "28", "bild": "/hefte/folien/tag-25/28.jpg", "daumen": "/hefte/folien/tag-25/t28.jpg", "label": "Folie 28/29", "titel": "Arbeitsauftrag 04: Entscheidung und Abbruchbedingung", "kern": "Der Tag endet nicht mit einer Rechnung, sondern mit einer Empfehlung.", "frage": "", "hinweis": "", "live": "bc", "notiz": "„Nicht machen“ laut als gültige Empfehlung aussprechen — sonst schreibt niemand sie hin. Die Abbruchbedingung braucht eine Zahl, einen Zeitpunkt und eine Person.", "orte": [{"x": 39.14, "y": 28.22, "w": 7.3, "h": 2.72, "t": "Break-even", "e": "Der Punkt, an dem der Fall gerade noch trägt. Welcher Wert darf wie stark schlechter werden?", "b": "Unter 38 % Anteil dauert es länger als 24 Monate."}, {"x": 28.24, "y": 13.97, "w": 24.1, "h": 5.0, "t": "Abbruchbedingung", "e": "Braucht eine Zahl, einen Zeitpunkt und eine Person.", "b": "Unter 50 % richtig nach 3 Monaten: Die Leitung stoppt."}]}, {"id": "29", "bild": "/hefte/folien/tag-25/29.jpg", "daumen": "/hefte/folien/tag-25/t29.jpg", "label": "Folie 29/29", "titel": "Was jetzt entschieden ist", "kern": "Aus drei Kandidaten ist eine Reihenfolge geworden, aus einer Ahnung eine Rechnung.", "frage": "Mit wem besprecht ihr eure Empfehlung bis zum nächsten Block?", "hinweis": "", "live": "", "notiz": "Kurz halten. Der Übergang zu Block 3 ist inhaltlich wichtig: Ohne verstandenen Prozess bleibt der gerechnete Nutzen eine Annahme.", "orte": [{"x": 52.66, "y": 30.62, "w": 4.71, "h": 2.72, "t": "Wie es weitergeht", "e": "Dort wird der Ablauf genau untersucht. Dann zeigt sich, ob die angenommenen Zeiten und Mengen stimmen.", "b": ""}]}]</script>
